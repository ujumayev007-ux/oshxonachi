<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofitsiant Paneli — Oshxonachi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f6f9; }
        #main-panel { padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
        .top-left-clock { position: absolute; top: 15px; left: 20px; font-size: 13px; font-weight: bold; color: #333; line-height: 1.4; }
        .header-center { margin-left: 170px; display: flex; gap: 10px; }
        .folder-btn { padding: 8px 16px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .folder-btn.active { background: #2a5298; color: white; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .table-card { background: white; border: 2px solid #27ae60; border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
        .table-card:hover { transform: translateY(-3px); }
        .table-card.busy { background-color: #ffe6e6; border-color: #e74c3c; }
        .table-card.preparing { background-color: #e3f2fd; border-color: #0288d1; }
        .table-card.ready { background-color: #e8f5e9; border-color: #2e7d32; }
        .table-card.calling { background-color: #fff3e0; border-color: #ff9800; animation: pulse-border 1.5s infinite; }
        @keyframes pulse-border {
            0% { border-color: #ff9800; box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.4); }
            70% { border-color: #f57c00; box-shadow: 0 0 0 10px rgba(255, 152, 0, 0); }
            100% { border-color: #ff9800; box-shadow: 0 0 0 0 rgba(255, 152, 0, 0); }
        }
        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-top: 5px; text-transform: uppercase; }
        .status-yangi { background: #ffe0b2; color: #e65100; }
        .status-qabul { background: #fff9c4; color: #f57f17; }
        .status-jarayonda { background: #bbdefb; color: #0d47a1; }
        .status-tayyor { background: #c8e6c9; color: #1b5e20; }
        .status-bosh { background: #e0e0e0; color: #424242; }
        .status-chaqiruv { background: #ffccbc; color: #d84315; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 600px; max-width: 90%; max-height: 90vh; overflow-y: auto; }
        .menu-item-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .qty-btn { padding: 2px 8px; background: #ddd; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .tab-btn { padding: 6px 12px; border: none; background: #eee; cursor: pointer; border-radius: 4px; margin-right: 5px; margin-bottom: 5px; font-size: 13px; }
        .tab-btn.active { background: #2a5298; color: white; }
    </style>
</head>
<body onclick="unlockAudioContext()"> <!-- Brauzer ovoz bloklashini oldini olish uchun -->

    <div id="main-panel">
        <div class="header">
            <div id="realtime-clock" class="top-left-clock"></div>
            <div class="header-center">
                <button id="folder-zal" class="folder-btn active" onclick="switchSection('zal')">Zal</button>
                <button id="folder-xonalar" class="folder-btn" onclick="switchSection('xonalar')">Xonalar</button>
            </div>
            <div class="header-right">
                <span id="logged-waiter-name" style="font-weight: bold; cursor: pointer;" onclick="changeWaiterName()">Ofitsiant: Admin</span>
                <button onclick="openHistory()" style="padding: 6px 12px; background: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer;">Tarix</button>
            </div>
        </div>

        <h2 id="section-heading-title" style="margin-top: 25px; font-weight: bold; font-size: 18px;">Zal Stollari (16 ta)</h2>
        <div id="tables-grid" class="grid-container"></div>
    </div>

    <!-- Modal Buyurtma Boshqaruvi -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 id="modal-title" style="margin: 0; font-weight: bold; font-size: 18px;">Boshqaruv</h3>
                <button onclick="closeModal()" style="border: none; background: none; font-size: 20px; cursor: pointer;">&times;</button>
            </div>
            
            <div id="call-alert-banner" style="display: none; margin-top: 10px; background: #ffe0b2; padding: 10px; border-radius: 6px; justify-content: space-between; align-items: center;">
                <span style="color: #e65100; font-weight: bold;">🔔 Bu stol ofitsiantni chaqirmoqda!</span>
                <button onclick="clearTableCall()" style="padding: 5px 10px; background: #e65100; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">Chaqiruvni o'chirish</button>
            </div>

            <div style="margin: 15px 0; display: flex; align-items: center; gap: 10px;">
                <span>Mehmonlar soni:</span>
                <button class="qty-btn" onclick="changeGuests(-1)">-</button>
                <span id="modal-guests-val" style="font-weight: bold; font-size: 16px;">1</span>
                <button class="qty-btn" onclick="changeGuests(1)">+</button>
            </div>
            <div style="margin-bottom: 10px;" id="menu-categories-tabs">
                <button class="tab-btn active" onclick="filterModalMenu('all', event)">Barchasi</button>
                <button class="tab-btn" onclick="filterModalMenu('Osh', event)">Osh</button>
                <button class="tab-btn" onclick="filterModalMenu('Suyuq ovqatlar', event)">Sho'rvalar</button>
                <button class="tab-btn" onclick="filterModalMenu('Quyuq taomlar', event)">Asosiy taomlar</button>
                <button class="tab-btn" onclick="filterModalMenu('Hamirli taomlar', event)">Hamirli taomlar</button>
                <button class="tab-btn" onclick="filterModalMenu('Kaboblar', event)">Kaboblar</button>
                <button class="tab-btn" onclick="filterModalMenu('Somsalar', event)">Somsalar</button>
                <button class="tab-btn" onclick="filterModalMenu('Fast Food', event)">Fast-food</button>
            </div>
            <div id="menu-selection-list" style="max-height: 250px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 6px;"></div>
            <div style="margin-top: 15px; background: #f9f9f9; padding: 10px; border-radius: 6px;" id="current-order-summary"></div>
            <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <button onclick="openReturnModal()" style="padding: 8px 15px; background: #e53935; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Vozvrat (Qaytarish)</button>
                <div style="display: flex; gap: 10px;">
                    <button onclick="printCheck()" style="padding: 8px 15px; background: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Chek chiqarish</button>
                    <button id="submit-order-btn" onclick="sendOrderToAdmin()" style="padding: 8px 15px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Buyurtmani yuborish</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Chek va QR Kod Modal -->
    <div id="check-modal" class="modal-overlay">
        <div class="modal-content" style="text-align: center; width: 350px;">
            <h3 style="font-weight: bold; font-size: 18px; color: #2a5298;">Restoran Cheki</h3>
            <div id="check-content-area" style="margin: 15px 0; text-align: left; font-size: 14px; background: #f9f9f9; padding: 10px; border-radius: 5px; border: 1px dashed #ccc;"></div>
            <div id="qrcode-container" style="display: flex; justify-content: center; margin: 15px 0;"></div>
            <button onclick="closeCheckModal()" style="padding: 8px 15px; background: #2a5298; color: white; border: none; border-radius: 5px; cursor: pointer;">Yopish</button>
        </div>
    </div>

    <!-- Vozvrat Modali -->
    <div id="return-modal" class="modal-overlay">
        <div class="modal-content" style="width: 400px;">
            <h3 style="font-weight: bold; font-size: 18px; color: #e53935;">Vozvrat (Qaytarish)</h3>
            <div id="return-items-list" style="max-height: 250px; overflow-y: auto; margin: 15px 0;"></div>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="confirmReturn()" style="padding: 8px 15px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Tasdiqlash</button>
                <button onclick="closeReturnModal()" style="padding: 8px 15px; background: #ccc; border: none; border-radius: 5px; cursor: pointer;">Bekor qilish</button>
            </div>
        </div>
    </div>

    <!-- Tarix Modali -->
    <div id="history-modal" class="modal-overlay">
        <div class="modal-content" style="width: 700px;">
            <h3 style="font-weight: bold; font-size: 18px;">Xizmat tarixi</h3>
            <div style="margin: 10px 0;">
                <input type="text" id="waiter-history-search" placeholder="Buyurtma raqami yoki stol qidirish..." oninput="renderWaiterHistory()" style="padding: 6px; width: 100%; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <div id="history-list" style="max-height: 300px; overflow-y: auto; margin: 15px 0;"></div>
            <button onclick="closeHistory()" style="padding: 8px 15px; background: #2a5298; color: white; border: none; border-radius: 5px; cursor: pointer;">Yopish</button>
        </div>
    </div>

    <script>
        let socket = null;
        let activeSection = 'zal';
        let activeWaiter = "Admin";
        let selectedTableNumber = null;
        let currentGuestsCount = 1;
        let currentCart = {};
        let activeFilter = 'all';
        let tablesState = {};
        let activeCalls = {}; 
        let fullMenu = [];
        let sessionStartTime = Date.now();
        let waiterStats = { ordersCount: 0, totalSum: 0, tablesWorked: new Set() };
        let audioCtx = null;

        window.onload = function() {
            loadMenuFromAdmin();
            loadOrdersFromStorage();
            loadCallsFromStorage(); 
            loadWaiterStats();

            try {
                socket = io('https://oshxonachi.onrender.com');

                socket.on('connect', () => console.log("Ofitsiant serverga ulandi"));
                socket.on('status_updated', (data) => {
                    if (!data) return;
                    updateLocalTableStatus(data.orderId || data.tableNumber, data.status, data.isPrinted, data.isPaid);
                });
                socket.on('update_orders', (serverOrders) => {
                    if (Array.isArray(serverOrders)) {
                        localStorage.setItem('waiter_orders', JSON.stringify(serverOrders));
                        loadOrdersFromStorage();
                        renderTables();
                    }
                });
                socket.on('call_waiter', (data) => handleIncomingCall(data));
                socket.on('table_called', (data) => handleIncomingCall(data));
            } catch (e) {}

            initClock();
            renderTables();

            window.addEventListener('storage', function(e) {
                if(e.key === 'admin_menu') loadMenuFromAdmin();
                if(['waiter_orders', 'active_orders', 'admin_orders', 'orders'].includes(e.key)) {
                    loadOrdersFromStorage(); 
                    renderTables();
                }
                if(e.key === 'waiter_calls' || e.key === 'trigger_sync') { 
                    loadCallsFromStorage();
                    renderTables();
                    playNotificationSound(); // Ovoz chiqarish
                }
            });

            setInterval(() => {
                loadMenuFromAdmin();
                loadOrdersFromStorage();
                loadCallsFromStorage();
                renderTables();
                updateWaiterStatsStorage();
            }, 1000);
        };

        // Brauzer avtomatik ovozni bloklamasligi uchun biror joyga bosilganda audio kontekstni yoqish
        function unlockAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Qattiqroq va eshitiladigan signal ovozi
        function playNotificationSound() { 
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                // Ikkita qo'ng'iroq ovozi ketma-ket (Beep-Beep)
                let playBeep = (timeOffset, freq) => {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq; 
                    
                    gain.gain.setValueAtTime(0.7, audioCtx.currentTime + timeOffset);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + timeOffset + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(audioCtx.currentTime + timeOffset);
                    osc.stop(audioCtx.currentTime + timeOffset + 0.3);
                };

                playBeep(0, 659.25);   // E5
                playBeep(0.35, 880);   // A5
            } catch(e) {
                console.log("Ovoz chiqarishda xatolik:", e);
            }
        }
        // 👇 SHU YERGA QO'YASIZ:
        let callSoundInterval = null;

        function startContinuousSound() {
            if (callSoundInterval) return;
            playNotificationSound();
            callSoundInterval = setInterval(() => {
                playNotificationSound();
            }, 3000);
        }

        function stopContinuousSound() {
            if (callSoundInterval) {
                clearInterval(callSoundInterval);
                callSoundInterval = null;
            }
        }
        function handleIncomingCall(data) {
            if (!data) return;
            let tableNum = typeof data === 'object' ? (data.tableNumber || data.table || data.id) : data;
            if (!tableNum) return;
            if (!String(tableNum).includes('Stol') && !String(tableNum).includes('Xona')) {
                tableNum = 'Stol #' + tableNum;
            }
            activeCalls[tableNum] = true;
            saveCallsToStorage();
            startContinuousSound(); // ✅ Takrorlanuvchi ovozni shu yerda boshlaymiz
            renderTables();

            if (selectedTableNumber === tableNum) {
                let callBanner = document.getElementById('call-alert-banner');
                if (callBanner) callBanner.style.display = 'flex';
            }
        }

        function loadCallsFromStorage() { 
            let saved = localStorage.getItem('waiter_calls');
            if(saved) {
                try { activeCalls = JSON.parse(saved); } catch(e) { activeCalls = {}; }
            }
        }

        function saveCallsToStorage() { 
            localStorage.setItem('waiter_calls', JSON.stringify(activeCalls));
            localStorage.setItem('trigger_sync', Date.now());
        }

        function clearTableCall() { 
            if(!selectedTableNumber) return;
            delete activeCalls[selectedTableNumber];
            saveCallsToStorage();
            stopContinuousSound(); // ✅ Ovozni to'xtatish
            document.getElementById('call-alert-banner').style.display = 'none';
            renderTables();
        // ✅ Mijoz tomoniga ofitsiant javob bergani haqida signal yuborish
            if (typeof socket !== 'undefined' && socket) {
                socket.emit('waiter_responded', { tableNumber: selectedTableNumber, waiter: activeWaiter });
            }
        }

        function loadMenuFromAdmin() {
            let adminMenu = JSON.parse(localStorage.getItem('admin_menu'));
            if(adminMenu && adminMenu.length > 0) {
                fullMenu = adminMenu.map(m => {
                    let sPrice = Number(m.sale_price || m.external_price || m.price || 0);
                    return { 
                        id: m.id, 
                        category: m.category, 
                        name: m.name, 
                        price: sPrice, 
                        sale_price: sPrice, 
                        external_price: sPrice,
                        internal_price: Number(m.internal_price || 0), 
                        is_visible: m.is_visible !== false && m.is_visible !== "false"
                    };
                });
            }
        }

        function updateLocalTableStatus(tableOrOrderId, newStatus, isPrinted, isPaid) {
            let waiterOrders = JSON.parse(localStorage.getItem('waiter_orders')) || [];
            let updated = false;

            waiterOrders = waiterOrders.map(o => {
                let currentKey = String(o.tableNumber || o.id);
                if (currentKey === String(tableOrOrderId)) {
                    if (newStatus !== undefined) o.status = newStatus;
                    if (isPrinted !== undefined) o.isPrinted = isPrinted;
                    if (isPaid !== undefined) o.isPaid = isPaid;
                    updated = true;
                }
                return o;
            });

            if (updated) {
                localStorage.setItem('waiter_orders', JSON.stringify(waiterOrders));
                localStorage.setItem('active_orders', JSON.stringify(waiterOrders));
                localStorage.setItem('admin_orders', JSON.stringify(waiterOrders));
            }
            loadOrdersFromStorage();
            renderTables();
        }

        function loadOrdersFromStorage() {
            tablesState = {};
            let waiterOrders = JSON.parse(localStorage.getItem('waiter_orders')) || [];
            let activeOrders = JSON.parse(localStorage.getItem('active_orders')) || [];
            let adminOrders = JSON.parse(localStorage.getItem('admin_orders')) || [];
            let combined = [...waiterOrders, ...activeOrders, ...adminOrders];
            let uniqueMap = new Map();

            combined.forEach(o => {
                let key = String(o.tableNumber || o.id);
                if (!key || key === 'undefined') return;
                uniqueMap.set(key, o);
            });

            uniqueMap.forEach((tableData, key) => {
                if (tableData && tableData.status !== 'tolandi' && tableData.status !== 'bekor_qilindi') {
                    tablesState[key] = tableData;
                }
            });
        }

        function renderTables() {
            const grid = document.getElementById('tables-grid');
            if (!grid) return;
            grid.innerHTML = '';
            
            let count = activeSection === 'zal' ? 16 : 12;
            let prefix = activeSection === 'zal' ? 'Stol #' : 'Xona #';
            let tableLocks = JSON.parse(localStorage.getItem('waiter_table_locks')) || {};

            for (let i = 1; i <= count; i++) {
                let tableKey = prefix + i;
                let tableData = tablesState[tableKey];
                let isCalling = activeCalls[tableKey]; 
                let status = tableData ? (tableData.status || 'yangi') : 'bo\'sh';
                let cardClass = 'table-card', statusText = 'BO\'SH', badgeClass = 'status-badge status-bosh';

                let lockedBy = tableLocks[tableKey];
                let lockIndicator = lockedBy ? `<div style="font-size:10px; color:#d9534f; font-weight:bold;">Band: ${lockedBy}</div>` : '';

                if (isCalling) { 
                    cardClass += ' calling';
                    statusText = '🔔 CHAQIRUV';
                    badgeClass = 'status-badge status-chaqiruv';
                } else if (tableData && tableData.status !== 'tolandi' && tableData.status !== 'bekor_qilindi') {
                    if (status === 'qabul_qilindi') { cardClass += ' busy'; statusText = 'QABUL QILINDI'; badgeClass = 'status-badge status-qabul'; }
                    else if (status === 'tayyorlanyapti') { cardClass += ' preparing'; statusText = 'TAYYORLANYAPTI'; badgeClass = 'status-badge status-jarayonda'; }
                    else if (status === 'tayyor') { cardClass += ' ready'; statusText = 'TAYYOR'; badgeClass = 'status-badge status-tayyor'; }
                    else { cardClass += ' busy'; statusText = 'YANGI'; badgeClass = 'status-badge status-yangi'; }
                }

                grid.innerHTML += `
                    <div class="${cardClass}" onclick="openTableModal('${tableKey}')">
                        <div style="font-size: 24px; margin-bottom: 5px;">🪑</div>
                        <div style="font-weight: bold; font-size: 16px;">${tableKey}</div>
                        ${lockIndicator}
                        <div class="${badgeClass}">${statusText}</div>
                    </div>`;
            }
        }

        function openTableModal(tableKey) {
            let tableLocks = JSON.parse(localStorage.getItem('waiter_table_locks')) || {};
            if (tableLocks[tableKey] && tableLocks[tableKey] !== activeWaiter && activeWaiter !== "Admin") {
                alert(`Diqqat! Bu stol hozirda boshqa ofitsiant (${tableLocks[tableKey]}) tomonidan band qilingan!`);
                return;
            }

            tableLocks[tableKey] = activeWaiter;
            localStorage.setItem('waiter_table_locks', JSON.stringify(tableLocks));

            selectedTableNumber = tableKey;
            document.getElementById('modal-title').innerText = `${tableKey} Boshqaruvi`;
            
            let callBanner = document.getElementById('call-alert-banner');
            callBanner.style.display = activeCalls[tableKey] ? 'flex' : 'none';

            let existingOrder = tablesState[tableKey];
            currentCart = {};
            
            if (existingOrder && existingOrder.items) {
                currentGuestsCount = existingOrder.guestsCount || 1;
                existingOrder.items.forEach(item => {
                    let itemPrice = Number(item.sale_price || item.external_price || item.price || 0);
                    currentCart[item.id] = { ...item, price: itemPrice, sale_price: itemPrice, external_price: itemPrice };
                });
                document.getElementById('submit-order-btn').innerText = "Buyurtmani yangilash";
            } else {
                currentGuestsCount = 1;
                document.getElementById('submit-order-btn').innerText = "Buyurtmani yuborish";
            }

            document.getElementById('modal-guests-val').innerText = currentGuestsCount;
            renderModalMenu(); 
            updateOrderSummary();
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() { 
            document.getElementById('modal-overlay').style.display = 'none'; 
            renderTables();
        }
        
        function changeGuests(delta) {
            currentGuestsCount = Math.max(1, currentGuestsCount + delta);
            document.getElementById('modal-guests-val').innerText = currentGuestsCount;
        }

        function filterModalMenu(category, evt) {
            activeFilter = category;
            document.querySelectorAll('#menu-categories-tabs .tab-btn').forEach(b => b.classList.remove('active'));
            if(evt) evt.target.classList.add('active');
            renderModalMenu();
        }

        function renderModalMenu() {
            const container = document.getElementById('menu-selection-list');
            let filtered = activeFilter === 'all' ? fullMenu : fullMenu.filter(m => m.category === activeFilter);
            
            if (filtered.length === 0) {
                container.innerHTML = "<p style='padding:10px; color:#666;'>Bu kategoriyada taomlar topilmadi.</p>";
                return;
            }

            container.innerHTML = filtered.map(item => {
                if (item.is_visible === false) return '';
                let inCartQty = currentCart[item.id] ? currentCart[item.id].qty : 0;
                let displayPrice = Number(item.sale_price || item.external_price || item.price || 0);
                return `
                    <div class="menu-item-row">
                        <div>
                            <div style="font-weight: bold; font-size: 14px;">${item.name}</div>
                            <div style="font-size: 12px; color: #666;">${displayPrice.toLocaleString()} so'm</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <button class="qty-btn" onclick="updateCartItem(${item.id}, -1)">-</button>
                            <span style="font-weight: bold; font-size: 14px;">${inCartQty}</span>
                            <button class="qty-btn" onclick="updateCartItem(${item.id}, 1)">+</button>
                        </div>
                    </div>`;
            }).join('');
        }

        function updateCartItem(itemId, delta) {
            let item = fullMenu.find(m => m.id === itemId);
            if (!item) return;
            let itemPrice = Number(item.sale_price || item.external_price || item.price || 0);
            if (!currentCart[itemId]) currentCart[itemId] = { ...item, price: itemPrice, sale_price: itemPrice, external_price: itemPrice, qty: 0 };
            currentCart[itemId].qty += delta;
            if (currentCart[itemId].qty <= 0) delete currentCart[itemId];
            renderModalMenu(); 
            updateOrderSummary();
        }

        function updateOrderSummary() {
            const container = document.getElementById('current-order-summary');
            let items = Object.values(currentCart);
            if (items.length === 0) { container.innerHTML = "<p style='font-size: 13px; color: #777;'>Hozircha hech narsa tanlanmadi.</p>"; return; }
            let total = 0;
            let listHTML = items.map(i => {
                let p = Number(i.sale_price || i.external_price || i.price || 0);
                let sum = p * i.qty; total += sum;
                return `<div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px;"><span>${i.name} x ${i.qty}</span><b>${sum.toLocaleString()} so'm</b></div>`;
            }).join('');
            
            let existingOrder = tablesState[selectedTableNumber];
            let orderInfo = existingOrder ? `<div style="font-weight:bold; color:#0d47a1; margin-bottom:8px;">Buyurtma №: ${existingOrder.orderNumber}</div>` : '';
            container.innerHTML = `${orderInfo}${listHTML}<hr style="margin: 8px 0;"><div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 15px; color: #2a5298;"><span>Jami:</span><span>${total.toLocaleString()} so'm</span></div>`;
        }

        function sendOrderToAdmin() {
            let items = Object.values(currentCart);
            if (items.length === 0) { alert("Taom tanlang!"); return; }
            let existingOrder = tablesState[selectedTableNumber];
            let orderNumber = existingOrder ? existingOrder.orderNumber : Math.floor(10000 + Math.random() * 90000).toString();

            let orderData = {
                id: selectedTableNumber, 
                tableNumber: selectedTableNumber, 
                orderNumber: orderNumber,
                waiterName: activeWaiter, 
                guestsCount: currentGuestsCount, 
                items: items,
                status: existingOrder ? (existingOrder.status || 'yangi') : 'yangi',
                time: existingOrder ? existingOrder.time : new Date().toLocaleTimeString(),
                isPrinted: existingOrder ? !!existingOrder.isPrinted : false
            };

            let orderTotal = items.reduce((sum, i) => sum + Number(i.sale_price || i.price || 0) * i.qty, 0);
            waiterStats.ordersCount += 1;
            waiterStats.totalSum += orderTotal;
            waiterStats.tablesWorked.add(selectedTableNumber);
            updateWaiterStatsStorage();

            saveAndBroadcastOrder(orderData);
            closeModal(); 
            loadOrdersFromStorage(); 
            renderTables();
        }

        function saveAndBroadcastOrder(orderData) {
            let waiterOrders = JSON.parse(localStorage.getItem('waiter_orders')) || [];
            let index = waiterOrders.findIndex(o => String(o.tableNumber || o.id) === String(orderData.tableNumber));
            
            if (index >= 0) {
                waiterOrders[index] = { ...waiterOrders[index], ...orderData };
            } else {
                waiterOrders.push(orderData);
            }
            
            localStorage.setItem('waiter_orders', JSON.stringify(waiterOrders));
            localStorage.setItem('active_orders', JSON.stringify(waiterOrders));
            localStorage.setItem('admin_orders', JSON.stringify(waiterOrders));

            if (socket) socket.emit('new_order', orderData);
        }

        function openReturnModal() {
            let items = Object.values(currentCart);
            if(items.length === 0) { alert("Qaytarish uchun taom yo'q"); return; }
            const list = document.getElementById('return-items-list');
            list.innerHTML = items.map(i => `
                <div class="menu-item-row">
                    <span>${i.name} (${i.qty} ta)</span>
                    <button class="qty-btn" style="background:#ffcdd2; color:#c62828;" onclick="returnItem(${i.id})">Qaytarish (-1)</button>
                </div>
            `).join('');
            document.getElementById('return-modal').style.display = 'flex';
        }

        function returnItem(id) {
            if (currentCart[id] && currentCart[id].qty > 0) {
                currentCart[id].qty -= 1;
                if (currentCart[id].qty === 0) {
                    delete currentCart[id];
                }
                openReturnModal(); 
                updateOrderSummary(); 
                renderModalMenu();
            }
        }

        function confirmReturn() {
            let items = Object.values(currentCart);
            let existingOrder = tablesState[selectedTableNumber];

            // Agar barcha taomlar o'chirilib savat bo'shatilsa — buyurtma bekor qilinadi
            if (items.length === 0) {
                if (existingOrder) {
                    existingOrder.status = 'bekor_qilindi';
                    existingOrder.items = [];
                    saveAndBroadcastOrder(existingOrder);
                }
                
                // Stol qulfini olib tashlash
                try {
                    let tableLocks = JSON.parse(localStorage.getItem('waiter_table_locks')) || {};
                    if (selectedTableNumber && tableLocks[selectedTableNumber]) {
                        delete tableLocks[selectedTableNumber];
                        localStorage.setItem('waiter_table_locks', JSON.stringify(tableLocks));
                    }
                } catch (e) {}

            } else {
                // ✅ Agar ayrim taomlar o'chirilgan bo'lsa ham, qolgan taomlar bilan buyurtmani darhol adminga yuboramiz va yangilaymiz!
                if (existingOrder) {
                    existingOrder.items = items;
                    // Jami summani ham yangilab ketamiz
                    existingOrder.totalSum = items.reduce((sum, i) => sum + Number(i.sale_price || i.price || 0) * i.qty, 0);
                    saveAndBroadcastOrder(existingOrder);
                }
            }

            document.getElementById('return-modal').style.display = 'none';
            closeModal(); 
            renderTables();
            alert("Buyurtma muvaffaqiyatli yangilandi va adminga yuborildi!");
        }
        function printCheck() {
            let order = tablesState[selectedTableNumber];
            if (!order) { alert("Avval buyurtmani yuboring!"); return; }
            
            let total = 0;
            let checkHTML = `<b>${order.tableNumber}</b> | № ${order.orderNumber}<br><hr style="margin:5px 0">`;
            order.items.forEach(i => {
                let p = Number(i.sale_price || i.external_price || i.price || 0);
                let sum = p * Number(i.qty || 1); 
                total += sum;
                checkHTML += `${i.name} - ${i.qty}x = ${sum.toLocaleString()}<br>`;
            });
            checkHTML += `<hr style="margin:5px 0"><b>JAMI: ${total.toLocaleString()} so'm</b>`;
            
            document.getElementById('check-content-area').innerHTML = checkHTML;
            document.getElementById('qrcode-container').innerHTML = "";
            new QRCode(document.getElementById('qrcode-container'), { text: `Buyurtma: ${order.orderNumber} | Jami: ${total} so'm`, width: 128, height: 128 });
            
            order.isPrinted = true;
            let waiterOrders = JSON.parse(localStorage.getItem('waiter_orders')) || [];
            let updatedOrders = waiterOrders.map(o => { 
                if (String(o.tableNumber || o.id) === String(selectedTableNumber)) o.isPrinted = true;
                return o; 
            });
            
            localStorage.setItem('waiter_orders', JSON.stringify(updatedOrders));
            localStorage.setItem('active_orders', JSON.stringify(updatedOrders));
            localStorage.setItem('admin_orders', JSON.stringify(updatedOrders));

            if (socket) socket.emit('status_updated', { orderId: selectedTableNumber, tableNumber: selectedTableNumber, status: order.status, isPrinted: true });
            
            closeModal();
            loadOrdersFromStorage();
            renderTables();
            document.getElementById('check-modal').style.display = 'flex';
        }

       // Chek oynasi yopilganda yoki stol tozlanganda ishlaydigan yangi funksiya
        function clearTableOrder(tableNumber) {
            // 1. tablesState dan o'chirish
            if (tablesState[tableNumber]) {
                delete tablesState[tableNumber];
            }

            // 2. LocalStorage dagi faol buyurtmalardan olib tashlash
            let waiterOrders = JSON.parse(localStorage.getItem('waiter_orders')) || [];
            waiterOrders = waiterOrders.filter(o => String(o.tableNumber || o.id) !== String(tableNumber));
            localStorage.setItem('waiter_orders', JSON.stringify(waiterOrders));
            localStorage.setItem('active_orders', JSON.stringify(waiterOrders));
            localStorage.setItem('admin_orders', JSON.stringify(waiterOrders));

            // 3. Stol qulfini (lock) tozalash - "band" yozuvini yo'qotuvchi asosiy qism
            try {
                let tableLocks = JSON.parse(localStorage.getItem('waiter_table_locks')) || {};
                if (tableLocks[tableNumber]) {
                    delete tableLocks[tableNumber];
                    localStorage.setItem('waiter_table_locks', JSON.stringify(tableLocks));
                }
            } catch (e) {}

            // 4. Serverga o'chirilganligini xabar qilish
            if (socket) {
                socket.emit('status_updated', { orderId: tableNumber, tableNumber: tableNumber, status: 'closed', isCleared: true });
            }

            // 5. Sinxronizatsiya va ekranni yangilash
            localStorage.setItem('trigger_sync', Date.now());
            loadOrdersFromStorage();
            renderTables();
        }

        function closeCheckModal() { 
            // Chek yopilishi bilan stolni butunlay bo'shatish uchun clearTableOrder ni chaqiramiz
            if (selectedTableNumber) {
                clearTableOrder(selectedTableNumber);
            }
            
            document.getElementById('check-modal').style.display = 'none'; 
            loadOrdersFromStorage();
            renderTables(); 
        }

        function switchSection(sec) {
            activeSection = sec;
            document.getElementById('folder-zal').classList.toggle('active', sec === 'zal');
            document.getElementById('folder-xonalar').classList.toggle('active', sec === 'xonalar');
            document.getElementById('section-heading-title').innerText = sec === 'zal' ? 'Zal Stollari (16 ta)' : 'Alohida Xonalar (12 xona)';
            renderTables();
        }

        function changeWaiterName() {
            let name = prompt("Ismingizni kiriting:", activeWaiter);
            if (name) { 
                activeWaiter = name; 
                document.getElementById('logged-waiter-name').innerText = "Ofitsiant: " + activeWaiter; 
                sessionStartTime = Date.now();
                waiterStats = { ordersCount: 0, totalSum: 0, tablesWorked: new Set() };
            }
        }

        function initClock() { 
            setInterval(() => { 
                const now = new Date(); 
                document.getElementById('realtime-clock').innerText = now.toLocaleDateString() + "\n" + now.toLocaleTimeString(); 
            }, 1000); 
        }

        function openHistory() { document.getElementById('history-modal').style.display = 'flex'; renderWaiterHistory(); }
        function closeHistory() { document.getElementById('history-modal').style.display = 'none'; }
        
        function renderWaiterHistory() {
            let waiterOrders = JSON.parse(localStorage.getItem('waiter_orders')) || [];
            let container = document.getElementById('history-list');
            const query = (document.getElementById('waiter-history-search') || {}).value || "";
            
            let historyOrders = waiterOrders.filter(o => o.status === 'tolandi' || o.status === 'bekor_qilindi');
            if(query) historyOrders = historyOrders.filter(o => String(o.orderNumber).includes(query) || String(o.tableNumber).includes(query));

            if (historyOrders.length === 0) { container.innerHTML = "<p>Tarix bo'sh.</p>"; return; }
            container.innerHTML = historyOrders.map(o => {
                let color = o.status === 'bekor_qilindi' ? '#d32f2f' : '#27ae60';
                let text = o.status === 'bekor_qilindi' ? 'BEKOR QILINGAN' : 'TOLANDI';
                return `<div style="border-bottom: 1px solid #eee; padding: 8px 0; display:flex; justify-content:space-between;">
                    <span><b>№ ${o.orderNumber || '-'}</b> | ${o.tableNumber} | Vaqt: ${o.time || '-'}</span>
                    <span style="color: ${color}; font-weight: bold;">${text}</span>
                </div>`;
            }).join('');
        }

        function loadWaiterStats() {
            let savedStats = JSON.parse(localStorage.getItem('waiter_stats_summary')) || {};
            let currentStats = savedStats[activeWaiter] || {};
            waiterStats.ordersCount = currentStats.ordersCount || 0;
            waiterStats.totalSum = currentStats.totalSum || 0;
            waiterStats.tablesWorked = new Set(currentStats.tablesWorked || []);
        }

        function updateWaiterStatsStorage() {
            let onlineTimeSec = Math.floor((Date.now() - sessionStartTime) / 1000);
            let savedStats = JSON.parse(localStorage.getItem('waiter_stats_summary')) || {};
            savedStats[activeWaiter] = {
                onlineTime: onlineTimeSec,
                ordersCount: waiterStats.ordersCount,
                totalSum: waiterStats.totalSum,
                tablesWorked: Array.from(waiterStats.tablesWorked)
            };
            localStorage.setItem('waiter_stats_summary', JSON.stringify(savedStats));
        }
    </script>
</body>
</html>
