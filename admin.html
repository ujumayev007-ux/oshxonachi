<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Restoran</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f9;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .container {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .order-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid #2a5298;
        }
        .order-card.zal {
            border-left-color: #27ae60;
        }
        .order-card.xonalar {
            border-left-color: #ff9800;
        }
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
        .btn-danger { background: #e74c3c; }
        .btn-success { background: #27ae60; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-top: 20px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        th {
            background: #2a5298;
            color: white;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Restoran Admin Paneli</h2>
        <div>
            <button class="btn btn-danger" onclick="clearAllOrders()">Barcha buyurtmalarni tozalash</button>
        </div>
    </div>

    <div class="container">
        <h3>Kelib tushgan faol buyurtmalar</h3>
        <div id="admin-orders-grid" class="card-grid">
            <!-- Dinamik chiqadi -->
        </div>

        <h3 style="margin-top: 40px;">Stollar va Xonalar Holati</h3>
        <div id="tables-status-container"></div>

        <h3 style="margin-top: 40px;">Xizmat tarixi (Cheklar)</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Joy</th>
                        <th>Ofitsiant</th>
                        <th>Mehmonlar</th>
                        <th>Vaqt</th>
                        <th>Umumiy summa</th>
                    </tr>
                </thead>
                <tbody id="admin-history-list">
                    <!-- Tarix dinamik chiqadi -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        window.onload = function() {
            loadAdminData();
            setInterval(loadAdminData, 2000); // Har 2 sekundda yangilab turadi
        };

        function loadAdminData() {
            renderActiveOrders();
            renderTablesStatus();
            renderHistoryTable();
        }

        function renderActiveOrders() {
            let ordersGrid = document.getElementById('admin-orders-grid');
            let orders = JSON.parse(localStorage.getItem('admin_orders')) || [];
            
            ordersGrid.innerHTML = '';
            if (orders.length === 0) {
                ordersGrid.innerHTML = '<p style="color: #777; font-style: italic;">Hozircha faol buyurtmalar mavjud emas.</p>';
                return;
            }

            orders.forEach((order, index) => {
                let locationName = order.type === 'zal' ? `Stol #${order.number}` : `Xona #${order.number}`;
                let itemsHtml = '<ul style="padding-left: 15px; margin: 8px 0; font-size: 13px;">';
                let total = 0;

                order.items.forEach(i => {
                    itemsHtml += `<li>${i.name} - ${i.qty} ta (${(i.qty * i.price).toLocaleString()} so'm)</li>`;
                    total += i.qty * i.price;
                });
                itemsHtml += '</ul>';

                ordersGrid.innerHTML += `
                    <div class="order-card ${order.type}">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <h4 style="margin: 0; color: #333;">${locationName}</h4>
                            <span style="font-size: 12px; background: #eee; padding: 2px 6px; border-radius: 4px;">${order.time}</span>
                        </div>
                        <p style="margin: 5px 0; font-size: 13px; color: #555;">Ofitsiant: <b>${order.waiter}</b> | Mehmonlar: <b>${order.guests} ta</b></p>
                        ${itemsHtml}
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                            <span style="font-size: 14px; color: #27ae60;">Jami: <b>${total.toLocaleString()} so'm</b></span>
                            <button class="btn btn-success" onclick="completeOrder(${index}, '${order.type}', ${order.number})">Bajarildi</button>
                        </div>
                    </div>
                `;
            });
        }

        function completeOrder(index, type, number) {
            let orders = JSON.parse(localStorage.getItem('admin_orders')) || [];
            orders.splice(index, 1);
            localStorage.setItem('admin_orders', JSON.stringify(orders));

            // Stol yoki xonani bo'shatish yoki holatini yangilash
            let key = `${type}_item_${number}`;
            let itemData = JSON.parse(localStorage.getItem(key));
            if (itemData) {
                itemData.busy = false;
                itemData.items = [];
                localStorage.setItem(key, JSON.stringify(itemData));
            }

            loadAdminData();
        }

        function clearAllOrders() {
            if (confirm("Barcha faol buyurtmalarni o'chirmoqchimisiz?")) {
                localStorage.removeItem('admin_orders');
                loadAdminData();
            }
        }

        function renderTablesStatus() {
            let container = document.getElementById('tables-status-container');
            let html = '<div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px;">';
            
            ['zal', 'xonalar'].forEach(sec => {
                let count = sec === 'zal' ? 16 : 12;
                let secTitle = sec === 'zal' ? 'Zal Stolari' : 'Xonalar';
                html += `<div style="background: white; padding: 15px; border-radius: 8px; flex: 1; min-width: 250px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">`;
                html += `<h4>${secTitle}</h4><div style="display: flex; flex-direction: column; gap: 5px;">`;
                
                for (let i = 1; i <= count; i++) {
                    let key = `${sec}_item_${i}`;
                    let data = JSON.parse(localStorage.getItem(key)) || { busy: false };
                    let statusText = data.busy ? `🔴 Band (${data.guests || 1} kishi, Ofitsiant: ${data.waiter || 'Noma\'lum'})` : `🟢 Bo'sh`;
                    html += `<div style="font-size: 13px; display: flex; justify-content: space-between; border-bottom: 1px solid #f0f0f0; padding: 4px 0;"><span>#${i}</span> <span>${statusText}</span></div>`;
                }
                html += `</div></div>`;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function renderHistoryTable() {
            let historyList = document.getElementById('admin-history-list');
            let history = JSON.parse(localStorage.getItem('service_history')) || [];
            
            historyList.innerHTML = '';
            if (history.length === 0) {
                historyList.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #777;">Hozircha tarix bo\'sh.</td></tr>';
                return;
            }

            history.slice().reverse().forEach(h => {
                historyList.innerHTML += `
                    <tr>
                        <td>${h.location}</td>
                        <td>${h.waiter}</td>
                        <td>${h.guests} ta</td>
                        <td>${h.time}</td>
                        <td><b>${h.total ? h.total.toLocaleString() : 0} so'm</b></td>
                    </tr>
                `;
            });
        }
    </script>
</body>
</html>
