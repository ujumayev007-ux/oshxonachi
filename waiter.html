<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Ofitsant Paneli — Oshxonachi</title>
    <style>
        body {
            background-color: #e3f2fd;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background: #1976d2;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .container {
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .login-box button {
            background: #1976d2;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #tables-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }
        .table-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
            border: 2px solid #bbdefb;
            transition: 0.3s;
        }
        .table-card.busy {
            border-color: #ff9800;
            background: #fff3e0;
        }
        .table-card img.table-icon {
            width: 50px;
            height: 50px;
            object-fit: contain;
            margin-bottom: 5px;
        }
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 850px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .category-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 5px 0 10px 0;
            margin-bottom: 15px;
            white-space: nowrap;
        }
        .tab-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 15px;
            background: #e0e0e0;
            color: #333;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .tab-btn.active {
            background: #1976d2;
            color: white;
        }
        .menu-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        .menu-item-img {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .btn-blue {
            background: #0288d1;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-green {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .qty-btn {
            background: #e3f2fd;
            border: 1px solid #90caf9;
            padding: 4px 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- 1. Kirish Ekrani -->
    <div id="login-screen">
        <div class="login-box">
            <h3>Ofitsant Kirishi</h3>
            <input type="text" id="login-user" placeholder="Login (masalan: ofitsant1)">
            <input type="password" id="login-pass" placeholder="Parol">
            <button onclick="loginWaiter()">Kirish</button>
            <p style="font-size: 12px; color: #666; margin-top: 15px;">Parollar: ofitsant1-4 uchun 1111-4444</p>
        </div>
    </div>

    <!-- Asosiy Panel -->
    <div id="main-panel" style="display: none;">
        <header>
            <h2>Ofitsant Boshqaruv Paneli (12 ta Stol)</h2>
            <div>
                <span id="logged-waiter-name" style="margin-right: 15px; font-weight: bold;"></span>
                <button onclick="openHistory()" class="btn-blue" style="background:#00acc1;">Tarix</button>
                <button onclick="logoutWaiter()" style="background: #d32f2f; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer;">Chiqish</button>
            </div>
        </header>

        <div class="container">
            <h3>Stollar Holati</h3>
            <div id="tables-grid"></div>
        </div>
    </div>

    <!-- Stol Buyurtma va Boshqaruv Modali -->
    <div id="modal-overlay">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-top:0;">Stol Boshqaruvi</h2>
            
            <!-- Mijozlar sonini boshqarish (+ / -) -->
            <div style="background: #f5f5f5; padding: 10px 15px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
                <span style="font-weight: bold;">👥 Mijozlar (odam) soni:</span>
                <div>
                    <button class="qty-btn" onclick="changeGuests(-1)">-</button>
                    <span id="modal-guests-val" style="margin: 0 15px; font-size: 18px; font-weight: bold;">1</span>
                    <button class="qty-btn" onclick="changeGuests(1)">+</button>
                </div>
            </div>

            <!-- Kategoriyalar filtri -->
            <div class="category-tabs">
                <button class="tab-btn active" onclick="filterModalMenu('all', event)">Barchasi</button>
                <button class="tab-btn" onclick="filterModalMenu('osh', event)">Oshlar</button>
                <button class="tab-btn" onclick="filterModalMenu('supli', event)">Sho'rvalar</button>
                <button class="tab-btn" onclick="filterModalMenu('asosiy', event)">Asosiy</button>
                <button class="tab-btn" onclick="filterModalMenu('hamirli', event)">Hamirli</button>
                <button class="tab-btn" onclick="filterModalMenu('kabob', event)">Kaboblar</button>
                <button class="tab-btn" onclick="filterModalMenu('somsa', event)">Somsalar</button>
                <button class="tab-btn" onclick="filterModalMenu('fastfood', event)">Fast-food</button>
                <button class="tab-btn" onclick="filterModalMenu('drink', event)">Ichimliklar</button>
            </div>

            <h3 style="margin-bottom: 8px;">Menyu (To'liq ro'yxat)</h3>
            <div id="menu-selection-list" style="max-height: 250px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 8px;"></div>
            
            <h3 style="margin: 15px 0 8px 0;">Tanlangan Buyurtmalar</h3>
            <div id="current-order-summary" style="background: #fafafa; padding: 10px; border-radius: 8px; border: 1px solid #eee;"></div>
            
            <div style="margin-top: 20px; display: flex; justify-content: space-between; gap: 10px;">
                <button onclick="sendOrderToAdmin()" class="btn-green" style="flex: 1;">Adminiga Yuborish / Yangilash</button>
                <button onclick="printCheck()" class="btn-blue" style="background: #7b1fa2; flex: 1;">Chek Chop Etish (QR)</button>
                <button onclick="closeModal()" style="background: #757575; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;">Yopish</button>
            </div>
        </div>
    </div>

    <!-- Tarix Modali -->
    <div id="history-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center;">
        <div class="modal-content">
            <h2>Xizmat Ko'rsatish Tarixi</h2>
            <div id="history-list" style="max-height: 400px; overflow-y: auto; margin-top: 15px;"></div>
            <br>
            <button onclick="closeHistory()" class="btn-blue">Yopish</button>
        </div>
    </div>

    <script>
        const waitersDB = [
            { login: "ofitsant1", pass: "1111", name: "Anvar" },
            { login: "ofitsant2", pass: "2222", name: "Jasur" },
            { login: "ofitsant3", pass: "3333", name: "Sardor" },
            { login: "ofitsant4", pass: "4444", name: "Bobur" }
        ];

        // Kengaytirilgan va boyitilgan to'liq menyu ro'yxati
        const fullMenu = [
            // Oshlar
            { id: 1, category: "osh", name: "Buxoro oshi", price: 35000, img: "https://images.unsplash.com/photo-1633964913295-ceb43826e7c9?w=100" },
            { id: 2, category: "osh", name: "To'y oshi", price: 40000, img: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=100" },
            { id: 3, category: "osh", name: "Choyxona oshi", price: 38000, img: "https://images.unsplash.com/photo-1633964913295-ceb43826e7c9?w=100" },
            { id: 4, category: "osh", name: "Samarqand oshi", price: 42000, img: "https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=100" },
            
            // Sho'rvalar
            { id: 5, category: "supli", name: "Mastava", price: 22000, img: "https://images.unsplash.com/photo-1547592166-23ac45744acd?w=100" },
            { id: 6, category: "supli", name: "Moshkhurda", price: 20000, img: "https://images.unsplash.com/photo-1547592180-85f173990554?w=100" },
            { id: 7, category: "supli", name: "Qaynatma sho'rva", price: 25000, img: "https://images.unsplash.com/photo-1547592166-23ac45744acd?w=100" },
            { id: 8, category: "supli", name: "No'xat sho'rva", price: 23000, img: "https://images.unsplash.com/photo-1547592180-85f173990554?w=100" },

            // Asosiy taomlar
            { id: 9, category: "asosiy", name: "Jiz", price: 45000, img: "https://images.unsplash.com/photo-1544025162-d76694265947?w=100" },
            { id: 10, category: "asosiy", name: "Qozon kabob", price: 42000, img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=100" },
            { id: 11, category: "asosiy", name: "Dimlama", price: 32000, img: "https://images.unsplash.com/photo-1544025162-d76694265947?w=100" },
            { id: 12, category: "asosiy", name: "Tandir go'sht", price: 55000, img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=100" },

            // Hamirli taomlar
            { id: 13, category: "hamirli", name: "Norin", price: 30000, img: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=100" },
            { id: 14, category: "hamirli", name: "Manti (3 dona)", price: 25000, img: "https://images.unsplash.com/photo-1496116218417-1a781b1c416c?w=100" },
            { id: 15, category: "hamirli", name: "Chuchvara", price: 22000, img: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=100" },
            { id: 16, category: "hamirli", name: "Lag'mon", price: 28000, img: "https://images.unsplash.com/photo-1496116218417-1a781b1c416c?w=100" },

            // Kaboblar
            { id: 17, category: "kabob", name: "Qiyma kabob", price: 15000, img: "https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?w=100" },
            { id: 18, category: "kabob", name: "Jigar kabob", price: 18000, img: "https://images.unsplash.com/photo-1603048588665-791ca8aea617?w=100" },
            { id: 19, category: "kabob", name: "Qovurma kabob", price: 20000, img: "https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?w=100" },
            { id: 20, category: "kabob", name: "Tovuq kabob", price: 17000, img: "https://images.unsplash.com/photo-1603048588665-791ca8aea617?w=100" },

            // Somsalar
            { id: 21, category: "somsa", name: "Tandir somsa", price: 12000, img: "https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?w=100" },
            { id: 22, category: "somsa", name: "Varka somsa", price: 10000, img: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=100" },
            { id: 23, category: "somsa", name: "Ko'kat somsa", price: 8000, img: "https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?w=100" },
            { id: 24, category: "somsa", name: "Qovoq somsa", price: 8000, img: "https://images.unsplash.com/photo-1589301760014-d929f3979dbc?w=100" },

            // Fast-food
            { id: 25, category: "fastfood", name: "Klab-sendvich", price: 28000, img: "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=100" },
            { id: 26, category: "fastfood", name: "Burger", price: 30000, img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=100" },
            { id: 27, category: "fastfood", name: "Hot-dog", price: 15000, img: "https://images.unsplash.com/photo-1619740455993-9e612b1af08a?w=100" },
            { id: 28, category: "fastfood", name: "Lavash mol go'shtidan", price: 32000, img: "https://images.unsplash.com/photo-1626777552726-4a6b54c97e46?w=100" },

            // Ichimliklar
            { id: 29, category: "drink", name: "Suv 0.5L", price: 4000, img: "https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=100" },
            { id: 30, category: "drink", name: "Coca-Cola 1L", price: 12000, img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=100" },
            { id: 31, category: "drink", name: "Fanta 1L", price: 12000, img: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=100" },
            { id: 32, category: "drink", name: "Ko'k choy choynakda", price: 5000, img: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=100" }
        ];

        let currentActiveTable = null;
        let activeWaiter = localStorage.getItem('active_waiter') || null;
        let currentCategoryFilter = 'all';

        window.onload = function() {
            if (activeWaiter) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-panel').style.display = 'block';
                document.getElementById('logged-waiter-name').innerText = `Ofitsant: ${activeWaiter}`;
            }
            renderTables();
        };

        function loginWaiter() {
            let u = document.getElementById('login-user').value.trim();
            let p = document.getElementById('login-pass').value.trim();
            let found = waitersDB.find(w => w.login === u && w.pass === p);
            if (found) {
                activeWaiter = found.name;
                localStorage.setItem('active_waiter', activeWaiter);
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-panel').style.display = 'block';
                document.getElementById('logged-waiter-name').innerText = `Ofitsant: ${activeWaiter}`;
                renderTables();
            } else {
                alert("Login yoki parol noto'g'ri!");
            }
        }

        function logoutWaiter() {
            localStorage.removeItem('active_waiter');
            activeWaiter = null;
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('main-panel').style.display = 'none';
        }

        function renderTables() {
            const grid = document.getElementById('tables-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 12; i++) {
                let tableData = JSON.parse(localStorage.getItem(`table_${i}_data`)) || { busy: false, guests: 0, items: [] };
                
                grid.innerHTML += `
                    <div class="table-card ${tableData.busy ? 'busy' : ''}" onclick="openTable(${i})">
                        <img src="https://cdn-icons-png.flaticon.com/512/869/869636.png" class="table-icon" alt="Stol">
                        <h4 style="margin:5px 0;">Stol #${i}</h4>
                        <p style="font-size: 13px; margin: 0; font-weight: bold;">${tableData.busy ? `🔴 Band (${tableData.guests} kishi)` : '🟢 Bo\'sh'}</p>
                    </div>
                `;
            }
        }

        function openTable(tableNum) {
            currentActiveTable = tableNum;
            document.getElementById('modal-title').innerText = `Stol #${tableNum} Boshqaruvi`;
            let tableData = JSON.parse(localStorage.getItem(`table_${tableNum}_data`)) || { busy: false, guests: 1, items: [] };
            
            document.getElementById('modal-guests-val').innerText = tableData.guests || 1;
            currentCategoryFilter = 'all';
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.tab-btn').classList.add('active');

            renderMenuSelection(tableData.items);
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function changeGuests(delta) {
            let valSpan = document.getElementById('modal-guests-val');
            let currentGuests = parseInt(valSpan.innerText) + delta;
            if (currentGuests < 1) currentGuests = 1;
            valSpan.innerText = currentGuests;

            let tableData = JSON.parse(localStorage.getItem(`table_${currentActiveTable}_data`)) || { busy: false, guests: 1, items: [] };
            tableData.guests = currentGuests;
            localStorage.setItem(`table_${currentActiveTable}_data`, JSON.stringify(tableData));
        }

        function filterModalMenu(category, event) {
            currentCategoryFilter = category;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            let tableData = JSON.parse(localStorage.getItem(`table_${currentActiveTable}_data`)) || { items: [] };
            renderMenuSelection(tableData.items);
        }

        function renderMenuSelection(selectedItems) {
            let container = document.getElementById('menu-selection-list');
            container.innerHTML = '';

            let filteredMenu = currentCategoryFilter === 'all' 
                ? fullMenu 
                : fullMenu.filter(item => item.category === currentCategoryFilter);

            filteredMenu.forEach(dish => {
                let existing = selectedItems.find(i => i.id === dish.id);
                let qty = existing ? existing.qty : 0;

                container.innerHTML += `
                    <div class="menu-item-row">
                        <img src="${dish.img}" class="menu-item-img" alt="${dish.name}">
                        <div style="flex-grow: 1; margin-left: 12px;">
                            <strong>${dish.name}</strong><br>
                            <span style="color: #666; font-size: 13px;">${dish.price.toLocaleString()} so'm</span>
                        </div>
                        <div>
                            <button class="qty-btn" onclick="changeQty(${dish.id}, -1)">-</button>
                            <span id="qty_${dish.id}" style="margin: 0 10px; font-weight: bold;">${qty}</span>
                            <button class="qty-btn" onclick="changeQty(${dish.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
            updateOrderSummaryUI(selectedItems);
        }

        window.changeQty = function(dishId, delta) {
            let tableData = JSON.parse(localStorage.getItem(`table_${currentActiveTable}_data`)) || { busy: false, guests: parseInt(document.getElementById('modal-guests-val').innerText), items: [] };
            let existing = tableData.items.find(i => i.id === dishId);

            if (existing) {
                existing.qty += delta;
                if (existing.qty <= 0) {
                    tableData.items = tableData.items.filter(i => i.id !== dishId);
                }
            } else if (delta > 0) {
                let dish = fullMenu.find(d => d.id === dishId);
                if (dish) {
                    tableData.items.push({ id: dish.id, name: dish.name, price: dish.price, qty: 1 });
                }
            }

            localStorage.setItem(`table_${currentActiveTable}_data`, JSON.stringify(tableData));
            renderMenuSelection(tableData.items);
        }

        function updateOrderSummaryUI(items) {
            let summaryContainer = document.getElementById('current-order-summary');
            if (items.length === 0) {
                summaryContainer.innerHTML = '<p style="color: #777; font-style: italic; margin: 0; font-size: 13px;">Hozircha buyurtma bo\'sh</p>';
                return;
            }
            let html = '<ul style="padding-left: 20px; margin: 0 0 8px 0; font-size: 14px;">';
            let total = 0;
            items.forEach(i => {
                html += `<li>${i.name} - ${i.qty} ta x ${i.price.toLocaleString()} so'm = <b>${(i.qty * i.price).toLocaleString()} so'm</b></li>`;
                total += i.qty * i.price;
            });
            html += `</ul><div style="text-align: right; font-size: 15px;">Umumiy summa: <b>${total.toLocaleString()} so'm</b></div>`;
            summaryContainer.innerHTML = html;
        }

        function sendOrderToAdmin() {
            let guests = parseInt(document.getElementById('modal-guests-val').innerText);
            let tableData = JSON.parse(localStorage.getItem(`table_${currentActiveTable}_data`)) || { items: [] };
            
            if(tableData.items.length === 0) {
                alert("Iltimos, avval buyurtmaga taom qo'shing!");
                return;
            }

            tableData.busy = true;
            tableData.guests = guests;
            tableData.waiter = activeWaiter;
            tableData.status = 'Tayyorlanyapti';

            localStorage.setItem(`table_${currentActiveTable}_data`, JSON.stringify(tableData));

            let allOrders = JSON.parse(localStorage.getItem('admin_orders')) || [];
            allOrders.push({ table: currentActiveTable, ...tableData, time: new Date().toLocaleTimeString() });
            localStorage.setItem('admin_orders', JSON.stringify(allOrders));

            alert("Buyurtma Admin paneliga yuborildi!");
            closeModal();
            renderTables();
        }

        function printCheck() {
            let tableData = JSON.parse(localStorage.getItem(`table_${currentActiveTable}_data`));
            if (!tableData || tableData.items.length === 0) {
                alert("Chek chiqarish uchun buyurtma mavjud emas!");
                return;
            }
            
            let history = JSON.parse(localStorage.getItem('service_history')) || [];
            history.push({
                table: currentActiveTable,
                waiter: activeWaiter,
                time: new Date().toLocaleString(),
                items: tableData.items,
                guests: tableData.guests
            });
            localStorage.setItem('service_history', JSON.stringify(history));

            alert(`Stol #${currentActiveTable} uchun QR-kodli chek chop etildi va inkassa apparatiga yuborildi!`);
            
            localStorage.removeItem(`table_${currentActiveTable}_data`);
            closeModal();
            renderTables();
        }

        function openHistory() {
            let history = JSON.parse(localStorage.getItem('service_history')) || [];
            let container = document.getElementById('history-list');
            container.innerHTML = '';
            if (history.length === 0) {
                container.innerHTML = '<p>Hozircha tarix bo\'sh.</p>';
            } else {
                history.reverse().forEach(h => {
                    container.innerHTML += `
                        <div style="border-bottom: 1px solid #ccc; padding: 8px 0;">
                            <strong>Stol #${h.table}</strong> | Ofitsant: ${h.waiter} | Vaqt: ${h.time} | Mehmonlar: ${h.guests} ta
                        </div>
                    `;
                });
            }
            document.getElementById('history-modal').style.display = 'flex';
        }

        function closeHistory() {
            document.getElementById('history-modal').style.display = 'none';
        }
    </script>
</body>
</html>
