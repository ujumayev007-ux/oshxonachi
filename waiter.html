<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofitsiant Panel - Restoran</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f6f9; }
        #login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #1e3c72, #2a5298); }
        .login-box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 320px; text-align: center; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; }
        .login-box button { width: 100%; padding: 10px; background: #2a5298; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #main-panel { display: none; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .table-card { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .table-card.busy { background-color: #ffe6e6; border-color: #ff4d4d; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 500px; max-width: 90%; max-height: 90vh; overflow-y: auto; }
        .qty-btn { padding: 2px 8px; background: #ddd; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Login Ekrani -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Ofitsiant Tizimi</h2>
            <input type="text" id="login-user" placeholder="Login (masalan: Akmal)" value="Akmal">
            <input type="password" id="login-pass" placeholder="Parol (masalan: 112233)" value="112233">
            <button onclick="loginWaiter()">Kirish</button>
        </div>
    </div>

    <!-- Asosiy Panel -->
    <div id="main-panel">
        <div class="header">
            <div>Xush kelibsiz, <b id="logged-waiter-name"></b></div>
            <button onclick="logoutWaiter()" style="padding: 6px 12px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer;">Chiqish</button>
        </div>
        <h2 style="margin-top: 25px;">Zal Stollari</h2>
        <div id="tables-grid" class="grid-container"></div>
    </div>

    <!-- Stol Boshqaruv Modali -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 id="modal-title">Stol</h3>
                <button onclick="closeModal()" style="border: none; background: none; font-size: 20px; cursor: pointer;">&times;</button>
            </div>

            <div id="menu-selection-list" style="margin: 15px 0; max-height: 200px; overflow-y: auto; border: 1px solid #ddd; padding: 10px;"></div>

            <div style="background: #f9f9f9; padding: 10px;" id="current-order-summary"></div>

            <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="printCheck()" style="padding: 8px 15px; background: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Chek chiqarish</button>
                <button onclick="sendOrderToAdmin()" style="padding: 8px 15px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Buyurtmani yuborish</button>
            </div>
        </div>
    </div>

    <script>
        let currentWaiter = "";
        let currentTable = null;
        let activeCart = [];

        const menuItems = [
            { id: 1, name: "Toshkent oshi", price: 35000 },
            { id: 2, name: "Qaynatma shoʻrva", price: 25000 },
            { id: 3, name: "Coca-Cola 0.5L", price: 10000 }
        ];

        function loginWaiter() {
            const user = document.getElementById('login-user').value.trim();
            if(user) {
                currentWaiter = user;
                document.getElementById('logged-waiter-name').innerText = user;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-panel').style.display = 'block';
                renderTables();
            }
        }

        function logoutWaiter() {
            location.reload();
        }

        function renderTables() {
            const grid = document.getElementById('tables-grid');
            let tablesStatus = JSON.parse(localStorage.getItem('tables_status')) || {};
            
            grid.innerHTML = "";
            for(let i = 1; i <= 12; i++) {
                let isBusy = tablesStatus[i] && tablesStatus[i].isBusy;
                grid.innerHTML += `
                    <div class="table-card ${isBusy ? 'busy' : ''}" onclick="openTable(${i})">
                        <h4>Stol #${i}</h4>
                        <p>${isBusy ? 'Band' : 'Bo\'sh'}</p>
                    </div>
                `;
            }
        }

        function openTable(tableNum) {
            currentTable = tableNum;
            document.getElementById('modal-title').innerText = `Stol #${tableNum} Boshqaruvi`;
            let tablesStatus = JSON.parse(localStorage.getItem('tables_status')) || {};
            activeCart = (tablesStatus[tableNum] && tablesStatus[tableNum].items) ? tablesStatus[tableNum].items : [];
            
            renderModalMenu();
            renderSummary();
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function renderModalMenu() {
            const list = document.getElementById('menu-selection-list');
            list.innerHTML = menuItems.map(item => `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span>${item.name} (${item.price} so'm)</span>
                    <button class="qty-btn" onclick="addToCart(${item.id})">+</button>
                </div>
            `).join('');
        }

        function addToCart(itemId) {
            let item = menuItems.find(m => m.id === itemId);
            let exist = activeCart.find(c => c.id === itemId);
            if(exist) {
                exist.qty += 1;
            } else {
                activeCart.push({ id: item.id, name: item.name, price: item.price, qty: 1 });
            }
            renderSummary();
        }

        function renderSummary() {
            const summary = document.getElementById('current-order-summary');
            let total = activeCart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            summary.innerHTML = `<b>Buyurtmalar:</b><br>` + 
                activeCart.map(i => `${i.name} x ${i.qty} = ${i.price * i.qty} so'm`).join('<br>') + 
                `<br><b>Jami: ${total.toLocaleString()} so'm</b>`;
        }

        function sendOrderToAdmin() {
            if(activeCart.length === 0) {
                alert("Savatcha bo'sh!");
                return;
            }

            let waiterOrders = JSON.parse(localStorage.getItem('waiter_orders')) || [];
            let existingOrderIndex = waiterOrders.findIndex(o => o.tableNumber === currentTable && o.status !== 'tolandi');

            let orderData = {
                tableNumber: currentTable,
                waiterName: currentWaiter,
                items: activeCart,
                status: 'yangi',
                isPrinted: false
            };

            if(existingOrderIndex >= 0) {
                waiterOrders[existingOrderIndex] = orderData;
            } else {
                waiterOrders.push(orderData);
            }

            localStorage.setItem('waiter_orders', JSON.stringify(waiterOrders));

            // Stolni band qilish
            let tablesStatus = JSON.parse(localStorage.getItem('tables_status')) || {};
            tablesStatus[currentTable] = { isBusy: true, items: activeCart };
            localStorage.setItem('tables_status', JSON.stringify(tablesStatus));

            alert("Buyurtma adminga yuborildi!");
            closeModal();
            renderTables();
        }

        function printCheck() {
            let waiterOrders = JSON.parse(localStorage.getItem('waiter_orders')) || [];
            let order = waiterOrders.find(o => o.tableNumber === currentTable && o.status !== 'tolandi');
            
            if(order) {
                order.isPrinted = true; // Admin panelida to'lov tugmasini chiqaruvchi asosiy belgi
                localStorage.setItem('waiter_orders', JSON.stringify(waiterOrders));
                alert("Chek chiqarildi! Admin panelida to'lov oynasi faollashdi.");
            } else {
                alert("Avval buyurtmani yuboring!");
            }
        }
    </script>
</body>
</html>
