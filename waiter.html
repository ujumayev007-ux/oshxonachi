<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofitsiant Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f6f9; }
        #main-panel { padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; }
        .top-left-clock { position: absolute; top: 15px; left: 20px; font-size: 13px; font-weight: bold; color: #333; line-height: 1.4; }
        .header-center { margin-left: 170px; display: flex; gap: 10px; }
        .folder-btn { padding: 8px 16px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .folder-btn.active { background: #2a5298; color: white; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 20px; }
        .table-card { background: white; border: 2px solid #27ae60; border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
        .table-card:hover { transform: translateY(-3px); }
        .table-card.busy { background-color: #ffe6e6; border-color: #e74c3c; }
        .table-card.preparing { background-color: #e3f2fd; border-color: #0288d1; }
        .table-card.ready { background-color: #e8f5e9; border-color: #2e7d32; }
        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-top: 5px; text-transform: uppercase; }
        .status-yangi { background: #ffe0b2; color: #e65100; }
        .status-qabul { background: #fff9c4; color: #f57f17; }
        .status-jarayonda { background: #bbdefb; color: #0d47a1; }
        .status-tayyor { background: #c8e6c9; color: #1b5e20; }
        .status-bosh { background: #e0e0e0; color: #424242; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 600px; max-width: 90%; max-height: 90vh; overflow-y: auto; }
        .menu-item-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .qty-btn { padding: 2px 8px; background: #ddd; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }
        .tab-btn { padding: 6px 12px; border: none; background: #eee; cursor: pointer; border-radius: 4px; margin-right: 5px; margin-bottom: 5px; font-size: 13px; }
        .tab-btn.active { background: #2a5298; color: white; }
    </style>
</head>
<body>

    <div id="main-panel">
        <div class="header">
            <div id="realtime-clock" class="top-left-clock"></div>
            <div class="header-center">
                <button id="folder-zal" class="folder-btn active" onclick="switchSection('zal')">Zal</button>
                <button id="folder-xonalar" class="folder-btn" onclick="switchSection('xonalar')">Xonalar</button>
            </div>
            <div class="header-right">
                <span id="logged-waiter-name" style="font-weight: bold;cursor: pointer;" onclick="changeWaiterName()">Ofitsiant: Admin</span>
                <button onclick="openHistory()" style="padding: 6px 12px; background: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer;">Tarix</button>
            </div>
        </div>

        <h2 id="section-heading-title" style="margin-top: 25px; font-weight: bold; font-size: 18px;">Zal Stollari (16 ta)</h2>
        <div id="tables-grid" class="grid-container"></div>
    </div>

    <!-- Modal Buyurtma Boshqaruvi -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 id="modal-title" style="margin: 0; font-weight: bold; font-size: 18px;">Boshqaruv</h3>
                <button onclick="closeModal()" style="border: none; background: none; font-size: 20px; cursor: pointer;">&times;</button>
            </div>
            <div style="margin: 15px 0; display: flex; align-items: center; gap: 10px;">
                <span>Mehmonlar soni:</span>
                <button class="qty-btn" onclick="changeGuests(-1)">-</button>
                <span id="modal-guests-val" style="font-weight: bold; font-size: 16px;">1</span>
                <button class="qty-btn" onclick="changeGuests(1)">+</button>
            </div>
            <div style="margin-bottom: 10px;" id="menu-categories-tabs">
                <button class="tab-btn active" onclick="filterModalMenu('all', event)">Barchasi</button>
                <button class="tab-btn" onclick="filterModalMenu('Osh', event)">Osh</button>
                <button class="tab-btn" onclick="filterModalMenu('Suyuq ovqatlar', event)">Suyuq ovqatlar</button>
                <button class="tab-btn" onclick="filterModalMenu('Quyuq taomlar', event)">Quyuq taomlar</button>
                <button class="tab-btn" onclick="filterModalMenu('Hamirli taomlar', event)">Hamirli taomlar</button>
                <button class="tab-btn" onclick="filterModalMenu('Kaboblar', event)">Kaboblar</button>
                <button class="tab-btn" onclick="filterModalMenu('Somsalar', event)">Somsalar</button>
                <button class="tab-btn" onclick="filterModalMenu('Fast Food', event)">Fast Food</button>
                <button class="tab-btn" onclick="filterModalMenu('Ichimliklar', event)">Ichimliklar</button>
            </div>
            <div id="menu-selection-list" style="max-height: 250px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 6px;"></div>
            <div style="margin-top: 15px; background: #f9f9f9; padding: 10px; border-radius: 6px;" id="current-order-summary"></div>
            <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <button onclick="openReturnModal()" style="padding: 8px 15px; background: #e53935; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Vozvrat (Qaytarish)</button>
                <div style="display: flex; gap: 10px;">
                    <button onclick="printCheck()" style="padding: 8px 15px; background: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Chek chiqarish</button>
                    <button id="submit-order-btn" onclick="sendOrderToAdmin()" style="padding: 8px 15px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Buyurtmani yuborish</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Chek va QR Kod Modal -->
    <div id="check-modal" class="modal-overlay">
        <div class="modal-content" style="text-align: center; width: 350px;">
            <h3 style="font-weight: bold; font-size: 18px; color: #2a5298;">Restoran Cheki</h3>
            <div id="check-content-area" style="margin: 15px 0; text-align: left; font-size: 14px; background: #f9f9f9; padding: 10px; border-radius: 5px; border: 1px dashed #ccc;"></div>
            <div id="qrcode-container" style="display: flex; justify-content: center; margin: 15px 0;"></div>
            <p style="font-size: 12px; color: #666; margin-bottom: 15px;">To'lov qabul qilingach, stol avtomatik bo'shatiladi.</p>
            <button onclick="closeCheckModal()" style="padding: 8px 15px; background: #2a5298; color: white; border: none; border-radius: 5px; cursor: pointer;">Yopish</button>
        </div>
    </div>

    <!-- Vozvrat Modali -->
    <div id="return-modal" class="modal-overlay">
        <div class="modal-content" style="width: 400px;">
            <h3 style="font-weight: bold; font-size: 18px; color: #e53935;">Vozvrat (Qaytarish)</h3>
            <div id="return-items-list" style="max-height: 250px; overflow-y: auto; margin: 15px 0;"></div>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="confirmReturn()" style="padding: 8px 15px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Tasdiqlash</button>
                <button onclick="closeReturnModal()" style="padding: 8px 15px; background: #ccc; border: none; border-radius: 5px; cursor: pointer;">Bekor qilish</button>
            </div>
        </div>
    </div>

    <!-- Tarix Modali -->
    <div id="history-modal" class="modal-overlay">
        <div class="modal-content" style="width: 700px;">
            <h3 style="font-weight: bold; font-size: 18px;">Xizmat tarixi</h3>
            <div style="margin: 10px 0;">
                <input type="text" id="waiter-history-search" placeholder="Buyurtma raqami yoki stol qidirish..." oninput="renderWaiterHistory()" style="padding: 6px; width: 100%; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <div id="history-list" style="max-height: 300px; overflow-y: auto; margin: 15px 0;"></div>
            <button onclick="closeHistory()" style="padding: 8px 15px; background: #2a5298; color: white; border: none; border-radius: 5px; cursor: pointer;">Yopish</button>
        </div>
    </div>

    <script>
        let socket = null;
        let activeSection = 'zal';
        let activeWaiter = "Admin";
        let selectedTableNumber = null;
        let currentGuestsCount = 1;
        let currentCart = {};
        let activeFilter = 'all';
        let tablesState = {};
        let fullMenu = [];

        window.onload = function() {
            loadMenuFromAdmin();
            try {
                socket = io('https://oshxonachi-server.onrender.com');
                socket.on('status_updated', (data) => { updateLocalTableStatus(data.orderId, data.status, data.isPrinted, data.isPaid); });
                socket.on('update_orders', (serverOrders) => {
                    if (Array.isArray(serverOrders)) {
                        localStorage.setItem('waiter_orders', JSON.stringify(serverOrders));
                        loadOrdersFromStorage();
                        renderTables();
                    }
                });
            } catch (e) {}

            initClock();
            loadOrdersFromStorage();
            renderTables();

            window.addEventListener('storage', function(e) {
                if(e.key === 'admin_menu') loadMenuFromAdmin();
                if(e.key === 'waiter_orders' || e.key === 'active_orders' || e.key === 'orders') {
                    loadOrdersFromStorage(); renderTables();
                }
            });
        };

        function loadMenuFromAdmin() {
            let adminMenu = JSON.parse(localStorage.getItem('admin_menu'));
            if(adminMenu && adminMenu.length > 0) {
                fullMenu = adminMenu.map(m => ({ id: m.id, category: m.category, name: m.name, price: m.sale_price, is_visible: m.is_visible }));
            }
        }

        function updateLocalTableStatus(tableOrOrderId, newStatus, isPrinted, isPaid) {
            let waiterOrders = JSON.parse(localStorage.getItem('waiter_orders')) || [];
            waiterOrders = waiterOrders.map(o => {
                if (String(o.id || o.tableNumber) === String(tableOrOrderId)) {
                    o.status = newStatus;
                    if (isPrinted !== undefined) o.isPrinted = isPrinted;
                    if (isPaid !== undefined) o.isPaid = isPaid;
                }
                return o;
            });
            localStorage.setItem('waiter_orders', JSON.stringify(waiterOrders));
            loadOrdersFromStorage();
            renderTables();
            if(document.getElementById('history-modal').style.display === 'flex') renderWaiterHistory();
        }

        function loadOrdersFromStorage() {
            tablesState = {};
            let waiterOrders = JSON.parse(localStorage.getItem('waiter_orders')) || [];
            waiterOrders.forEach(o => {
                // Tolandi va Bekor qilingan stollar zalda ko'rinmasligi kerak (stol bo'shaydi)
                if (o.tableNumber && o.status !== 'tolandi' && o.status !== 'bekor_qilindi') {
                    tablesState[o.tableNumber] = o;
                }
            });
        }

        function renderTables() {
            const grid = document.getElementById('tables-grid');
            grid.innerHTML = '';
            let count = activeSection === 'zal' ? 16 : 8;
            let prefix = activeSection === 'zal' ? 'Stol #' : 'Xona #';

            for (let i = 1; i <= count; i++) {
                let tableKey = prefix + i;
                let tableData = tablesState[tableKey];
                let status = tableData ? (tableData.status || 'yangi') : 'bo\'sh';
                let cardClass = 'table-card', statusText = 'BO\'SH', badgeClass = 'status-badge status-bosh';

                if (tableData) {
                    if (status === 'qabul_qilindi') { cardClass += ' busy'; statusText = 'QABUL QILINDI'; badgeClass = 'status-badge status-qabul'; }
                    else if (status === 'tayyorlanyapti') { cardClass += ' preparing'; statusText = 'TAYYORLANYAPTI'; badgeClass = 'status-badge status-jarayonda'; }
                    else if (status === 'tayyor') { cardClass += ' ready'; statusText = 'TAYYOR'; badgeClass = 'status-badge status-tayyor'; }
                    else { cardClass += ' busy'; statusText = 'YANGI'; badgeClass = 'status-badge status-yangi'; }
                }

                grid.innerHTML += `
                    <div class="${cardClass}" onclick="openTableModal('${tableKey}')">
                        <div style="font-size: 24px; margin-bottom: 5px;">🪑</div>
                        <div style="font-weight: bold; font-size: 16px;">${tableKey}</div>
                        <div class="${badgeClass}">${statusText}</div>
                    </div>`;
            }
        }

        function openTableModal(tableKey) {
            selectedTableNumber = tableKey;
            document.getElementById('modal-title').innerText = `${tableKey} Boshqaruvi`;
            let existingOrder = tablesState[tableKey];
            currentCart = {};
            
            if (existingOrder) {
                currentGuestsCount = existingOrder.guestsCount || 1;
                (existingOrder.items || []).forEach(item => currentCart[item.id] = { ...item });
                document.getElementById('submit-order-btn').innerText = "Buyurtmani yangilash";
            } else {
                currentGuestsCount = 1;
                document.getElementById('submit-order-btn').innerText = "Buyurtmani yuborish";
            }

            document.getElementById('modal-guests-val').innerText = currentGuestsCount;
            renderModalMenu(); updateOrderSummary();
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
        
        function changeGuests(delta) {
            currentGuestsCount = Math.max(1, currentGuestsCount + delta);
            document.getElementById('modal-guests-val').innerText = currentGuestsCount;
        }

        function filterModalMenu(category, evt) {
            activeFilter = category;
            document.querySelectorAll('#menu-categories-tabs .tab-btn').forEach(b => b.classList.remove('active'));
            if(evt) evt.target.classList.add('active');
            renderModalMenu();
        }

        function renderModalMenu() {
            const container = document.getElementById('menu-selection-list');
            let filtered = activeFilter === 'all' ? fullMenu : fullMenu.filter(m => m.category === activeFilter);
            container.innerHTML = filtered.filter(m => m.is_visible !== false).map(item => {
                let inCartQty = currentCart[item.id] ? currentCart[item.id].qty : 0;
                return `
                    <div class="menu-item-row">
                        <div>
                            <div style="font-weight: bold; font-size: 14px;">${item.name}</div>
                            <div style="font-size: 12px; color: #666;">${item.price.toLocaleString()} so'm</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <button class="qty-btn" onclick="updateCartItem(${item.id}, -1)">-</button>
                            <span style="font-weight: bold; font-size: 14px;">${inCartQty}</span>
                            <button class="qty-btn" onclick="updateCartItem(${item.id}, 1)">+</button>
                        </div>
                    </div>`;
            }).join('');
        }

        function updateCartItem(itemId, delta) {
            let item = fullMenu.find(m => m.id === itemId);
            if (!item) return;
            if (!currentCart[itemId]) currentCart[itemId] = { ...item, qty: 0 };
            currentCart[itemId].qty += delta;
            if (currentCart[itemId].qty <= 0) delete currentCart[itemId];
            renderModalMenu(); updateOrderSummary();
        }

        function updateOrderSummary() {
            const container = document.getElementById('current-order-summary');
            let items = Object.values(currentCart);
            if (items.length === 0) { container.innerHTML = "<p style='font-size: 13px; color: #777;'>Hozircha hech narsa tanlanmadi.</p>"; return; }
            let total = 0;
            let listHTML = items.map(i => {
                let sum = i.price * i.qty; total += sum;
                return `<div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px;"><span>${i.name} x ${i.qty}</span><b>${sum.toLocaleString()} so'm</b></div>`;
            }).join('');
            
            let orderInfo = tablesState[selectedTableNumber] ? `<div style="font-weight:bold; color:#0d47a1; margin-bottom:8px;">Buyurtma №: ${tablesState[selectedTableNumber].orderNumber}</div>` : '';
            container.innerHTML = `${orderInfo}${listHTML}<hr style="margin: 8px 0;"><div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 15px; color: #2a5298;"><span>Jami:</span><span>${total.toLocaleString()} so'm</span></div>`;
        }

        function sendOrderToAdmin() {
            let items = Object.values(currentCart);
            if (items.length === 0) { alert("Taom tanlang!"); return; }
            let existingOrder = tablesState[selectedTableNumber];
            let orderNumber = existingOrder ? existingOrder.orderNumber : Math.floor(10000 + Math.random() * 90000).toString();

            let orderData = {
                id: selectedTableNumber, tableNumber: selectedTableNumber, orderNumber: orderNumber,
                waiterName: activeWaiter, guestsCount: currentGuestsCount, items: items,
                status: existingOrder ? (existingOrder.status || 'yangi') : 'yangi',
                time: existingOrder ? existingOrder.time : new Date().toLocaleTimeString()
            };

            let waiterOrders = JSON.parse(localStorage.getItem('waiter_orders')) || [];
            let index = waiterOrders.findIndex(o => o.tableNumber === selectedTableNumber && o.status !== 'tolandi' && o.status !== 'bekor_qilindi');
            if (index >= 0) waiterOrders[index] = orderData; else waiterOrders.push(orderData);
            
            localStorage.setItem('waiter_orders', JSON.stringify(waiterOrders));
            if (socket) socket.emit('new_order', orderData);
            
            closeModal(); loadOrdersFromStorage(); renderTables();
        }

        // Vozvrat funksiyasi
        function openReturnModal() {
            let items = Object.values(currentCart);
            if(items.length === 0) { alert("Qaytarish uchun taom yo'q"); return; }
            const list = document.getElementById('return-items-list');
            list.innerHTML = items.map(i => `
                <div class="menu-item-row">
                    <span>${i.name} (${i.qty} ta)</span>
                    <button class="qty-btn" style="background:#ffcdd2; color:#c62828;" onclick="returnItem(${i.id})">Qaytarish (-1)</button>
                </div>
            `).join('');
            document.getElementById('return-modal').style.display = 'flex';
        }

        function returnItem(id) {
            if(currentCart[id] && currentCart[id].qty > 0) {
                currentCart[id].qty -= 1;
                if(currentCart[id].qty === 0) delete currentCart[id];
                openReturnModal(); updateOrderSummary(); renderModalMenu();
            }
        }
        function confirmReturn() {
            sendOrderToAdmin(); // Avtomatik tarzda admin panelda ham summalar o'zgaradi
            document.getElementById('return-modal').style.display = 'none';
            alert("Vozvrat muvaffaqiyatli amalga oshirildi!");
        }
        function closeReturnModal() { document.getElementById('return-modal').style.display = 'none'; }

        // Chek va QR Kod
        function printCheck() {
            let order = tablesState[selectedTableNumber];
            if (!order) { alert("Buyurtma yuborilmagan!"); return; }
            
            let total = 0;
            let checkHTML = `<b>${order.tableNumber}</b> | № ${order.orderNumber}<br><hr style="margin:5px 0">`;
            order.items.forEach(i => {
                let sum = i.price * i.qty; total += sum;
                checkHTML += `${i.name} - ${i.qty}x = ${sum.toLocaleString()}<br>`;
            });
            checkHTML += `<hr style="margin:5px 0"><b>JAMI: ${total.toLocaleString()} so'm</b>`;
            
            document.getElementById('check-content-area').innerHTML = checkHTML;
            document.getElementById('qrcode-container').innerHTML = "";
            new QRCode(document.getElementById('qrcode-container'), { text: `Buyurtma: ${order.orderNumber} | Jami: ${total} so'm`, width: 128, height: 128 });
            
            order.isPrinted = true;
            let waiterOrders = JSON.parse(localStorage.getItem('waiter_orders')) || [];
            waiterOrders = waiterOrders.map(o => { if (o.tableNumber === selectedTableNumber) o.isPrinted = true; return o; });
            localStorage.setItem('waiter_orders', JSON.stringify(waiterOrders));
            if (socket) socket.emit('change_status', { orderId: selectedTableNumber, status: order.status, isPrinted: true });
            
            closeModal();
            document.getElementById('check-modal').style.display = 'flex';
        }
        function closeCheckModal() { document.getElementById('check-modal').style.display = 'none'; renderTables(); }

        function switchSection(sec) {
            activeSection = sec;
            document.getElementById('folder-zal').classList.toggle('active', sec === 'zal');
            document.getElementById('folder-xonalar').classList.toggle('active', sec === 'xonalar');
            document.getElementById('section-heading-title').innerText = sec === 'zal' ? 'Zal Stollari (16 ta)' : 'Alohida Xonalar (8 ta)';
            renderTables();
        }
        function changeWaiterName() {
            let name = prompt("Ismingizni kiriting:", activeWaiter);
            if (name) { activeWaiter = name; document.getElementById('logged-waiter-name').innerText = "Ofitsiant: " + activeWaiter; }
        }
        function initClock() { setInterval(() => { const now = new Date(); document.getElementById('realtime-clock').innerText = now.toLocaleDateString() + "\n" + now.toLocaleTimeString(); }, 1000); }

        function openHistory() { document.getElementById('history-modal').style.display = 'flex'; renderWaiterHistory(); }
        function closeHistory() { document.getElementById('history-modal').style.display = 'none'; }
        
        function renderWaiterHistory() {
            let waiterOrders = JSON.parse(localStorage.getItem('waiter_orders')) || [];
            let container = document.getElementById('history-list');
            const query = (document.getElementById('waiter-history-search') || {}).value || "";
            
            let historyOrders = waiterOrders.filter(o => o.status === 'tolandi' || o.status === 'bekor_qilindi');
            if(query) historyOrders = historyOrders.filter(o => String(o.orderNumber).includes(query) || String(o.tableNumber).includes(query));

            if (historyOrders.length === 0) { container.innerHTML = "<p>Tarix bo'sh.</p>"; return; }
            container.innerHTML = historyOrders.map(o => {
                let color = o.status === 'bekor_qilindi' ? '#d32f2f' : '#27ae60';
                let text = o.status === 'bekor_qilindi' ? 'BEKOR QILINGAN' : 'TOLANDI';
                return `<div style="border-bottom: 1px solid #eee; padding: 8px 0; display:flex; justify-content:space-between;">
                    <span><b>№ ${o.orderNumber || '-'}</b> | ${o.tableNumber}</span>
                    <span style="color: ${color}; font-weight: bold;">${text}</span>
                </div>`;
            }).join('');
        }
    </script>
</body>
</html>
