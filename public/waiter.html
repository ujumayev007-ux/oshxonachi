<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofitsant Paneli - Menyu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-6">
    <div class="max-w-7xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-4 rounded-xl shadow">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800">🍽️ Ofitsant Menyu Paneli</h1>
            <span class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm font-semibold">Online (Sinxron)</span>
        </header>

        <!-- Kategoriya filterlari -->
        <div id="category-filters" class="flex flex-wrap gap-2 mb-6">
            <button onclick="filterCategory('Barchasi')" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium transition hover:bg-blue-700 active-filter">Barchasi</button>
            <button onclick="filterCategory('Osh')" class="px-4 py-2 bg-white text-gray-700 rounded-lg text-sm font-medium shadow hover:bg-gray-50">Osh</button>
            <button onclick="filterCategory('Suyuq ovqatlar')" class="px-4 py-2 bg-white text-gray-700 rounded-lg text-sm font-medium shadow hover:bg-gray-50">Suyuq ovqatlar</button>
            <button onclick="filterCategory('Quyuq taomlar')" class="px-4 py-2 bg-white text-gray-700 rounded-lg text-sm font-medium shadow hover:bg-gray-50">Quyuq taomlar</button>
            <button onclick="filterCategory('Hamirli taomlar')" class="px-4 py-2 bg-white text-gray-700 rounded-lg text-sm font-medium shadow hover:bg-gray-50">Hamirli taomlar</button>
            <button onclick="filterCategory('Kaboblar')" class="px-4 py-2 bg-white text-gray-700 rounded-lg text-sm font-medium shadow hover:bg-gray-50">Kaboblar</button>
            <button onclick="filterCategory('Somsalar')" class="px-4 py-2 bg-white text-gray-700 rounded-lg text-sm font-medium shadow hover:bg-gray-50">Somsalar</button>
            <button onclick="filterCategory('Fast Food')" class="px-4 py-2 bg-white text-gray-700 rounded-lg text-sm font-medium shadow hover:bg-gray-50">Fast Food</button>
            <button onclick="filterCategory('Ichimliklar')" class="px-4 py-2 bg-white text-gray-700 rounded-lg text-sm font-medium shadow hover:bg-gray-50">Ichimliklar</button>
        </div>

        <!-- Mahsulotlar ro'yxati -->
        <div id="waiter-menu" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dinamik elementlar yuklanadi -->
        </div>
    </div>

    <script>
        const socket = io();
        let allMenuItems = [];
        let currentCategory = 'Barchasi';

        async function fetchWaiterMenu() {
            try {
                const res = await fetch('/api/waiter/menu');
                allMenuItems = await res.json();
                renderMenu(allMenuItems);
            } catch (err) {
                console.error("Menyuni yuklashda xatolik:", err);
            }
        }

        function renderMenu(items) {
            const container = document.getElementById('waiter-menu');
            container.innerHTML = '';

            const filtered = currentCategory === 'Barchasi' 
                ? items 
                : items.filter(i => i.category === currentCategory);

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500">Bu kategoriyada hozircha taomlar yo'q</div>`;
                return;
            }

            filtered.forEach(item => {
                container.innerHTML += `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden flex flex-col justify-between border border-gray-100 hover:shadow-lg transition">
                        <div>
                            <img src="/images/${item.image_url}" alt="${item.name}" class="w-full h-40 object-cover bg-gray-200" onerror="this.src='/images/default.jpg'">
                            <div class="p-4">
                                <span class="text-xs font-semibold px-2.5 py-1 bg-indigo-50 text-indigo-600 rounded-full">${item.category}</span>
                                <h3 class="text-lg font-bold text-gray-800 mt-2">${item.name}</h3>
                            </div>
                        </div>
                        <div class="p-4 pt-0 flex justify-between items-center border-t border-gray-100 mt-2 pt-3">
                            <span class="text-lg font-extrabold text-emerald-600">${Number(item.external_price).toLocaleString()} so'm</span>
                            <span class="text-xs font-medium px-2 py-1 bg-gray-100 text-gray-600 rounded">Omborda: ${item.stock_quantity} ta</span>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            renderMenu(allMenuItems);
        }

        // Real-vaqtda sinxronizatsiya (Admin o'zgartirsa ofitsantda darhol ko'rinadi)
        socket.on('menuUpdated', (serverMenu) => {
            allMenuItems = serverMenu.filter(i => i.is_visible == 1);
            renderMenu(allMenuItems);
        });

        fetchWaiterMenu();
    </script>
</body>
</html>
