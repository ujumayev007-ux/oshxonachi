<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofitsiant Panel - Restoran</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f9;
        }
        /* Login ekrani */
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 320px;
            text-align: center;
        }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .login-box button {
            width: 100%;
            padding: 10px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .login-box button:hover {
            background: #1e3c72;
        }

        /* Asosiy panel */
        #main-panel {
            display: none;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
        }
        
        /* Soat va sana chap yuqori burchakda */
        .top-left-clock {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 13px;
            font-weight: bold;
            color: #333;
            line-height: 1.4;
        }

        .header-center {
            margin-left: 170px; /* Soat uchun kengroq joy tashlandi */
            display: flex;
            gap: 10px;
        }
        .folder-btn {
            padding: 8px 16px;
            border: none;
            background: #e0e0e0;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.2s;
        }
        .folder-btn.active {
            background: #2a5298;
            color: white;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Grid va Kartochkalar dizayni */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .table-card {
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .table-card:hover {
            transform: translateY(-3px);
            border-color: #2a5298;
        }
        .table-card.busy {
            background-color: #ffe6e6;
            border-color: #ff4d4d;
        }
        .table-icon {
            width: 40px;
            height: 40px;
            object-fit: contain;
            margin-bottom: 5px;
        }

        /* Modal oyna */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 600px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .menu-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }
        .menu-item-img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
        }
        .qty-btn {
            padding: 2px 8px;
            background: #ddd;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }
        .qty-btn:hover {
            background: #ccc;
        }
        .tab-btn {
            padding: 6px 12px;
            border: none;
            background: #eee;
            cursor: pointer;
            border-radius: 4px;
            margin-right: 5px;
            margin-bottom: 5px;
            font-size: 13px;
        }
        .tab-btn.active {
            background: #2a5298;
            color: white;
        }
    </style>

            <input type="text" id="login-user" placeholder="Login">
            <input type="password" id="login-pass" placeholder="Parol">
            <button onclick="loginWaiter()">Kirish</button>
        </div>
    </div>

    <!-- Asosiy Panel -->

            <!-- Chap yuqori burchakdagi real vaqt soati va maxsus ikonkalari -->
            <div id="realtime-clock" class="top-left-clock"></div>

            <div class="header-center">
                <button id="folder-zal" class="folder-btn active" onclick="switchSection('zal')">Zal</button>
                <button id="folder-xonalar" class="folder-btn" onclick="switchSection('xonalar')">Xonalar</button>
            </div>

            <div class="header-right">
                <span id="logged-waiter-name" style="font-weight: bold;"></span>
                <button onclick="openHistory()" style="padding: 6px 12px; background: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer;">Tarix</button>
                <button onclick="logoutWaiter()" style="padding: 6px 12px; background: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer;">Chiqish</button>
            </div>
        </div>

        <h2 id="section-heading-title" style="margin-top: 25px;">Zal Stollari (16 ta)</h2>
        <div id="tables-grid" class="grid-container"></div>
    </div>

    <!-- Stol / Xona Boshqaruv Modali -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 id="modal-title" style="margin: 0;">Boshqaruv</h3>
                <button onclick="closeModal()" style="border: none; background: none; font-size: 20px; cursor: pointer;">&times;</button>
            </div>

            <div style="margin: 15px 0; display: flex; align-items: center; gap: 10px;">
                <span>Mehmonlar soni:</span>
                <button class="qty-btn" onclick="changeGuests(-1)">-</button>
                <span id="modal-guests-val" style="font-weight: bold; font-size: 16px;">1</span>
                <button class="qty-btn" onclick="changeGuests(1)">+</button>
            </div>

            <div style="margin-bottom: 10px;" id="menu-categories-tabs">
                <button class="tab-btn active" onclick="filterModalMenu('all', event)">Barchasi</button>
                <button class="tab-btn" onclick="filterModalMenu('Osh', event)">Osh</button>
                <button class="tab-btn" onclick="filterModalMenu('Suyuq ovqatlar', event)">Suyuq ovqatlar</button>
                <button class="tab-btn" onclick="filterModalMenu('Quyuq taomlar', event)">Quyuq taomlar</button>
                <button class="tab-btn" onclick="filterModalMenu('Hamirli taomlar', event)">Hamirli taomlar</button>
                <button class="tab-btn" onclick="filterModalMenu('Kaboblar', event)">Kaboblar</button>
                <button class="tab-btn" onclick="filterModalMenu('Somsalar', event)">Somsalar</button>
                <button class="tab-btn" onclick="filterModalMenu('Fast Food', event)">Fast Food</button>
            </div>

            <div id="menu-selection-list" style="max-height: 250px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 6px;">
                <!-- Menyu ro'yxati dinamik chiqadi -->
            </div>

            <div style="margin-top: 15px; background: #f9f9f9; padding: 10px; border-radius: 6px;" id="current-order-summary">
                <!-- Buyurtmalar yig'indisi -->
            </div>

            <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="printCheck()" style="padding: 8px 15px; background: #ff9800; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Chek chiqarish</button>
                <button onclick="sendOrderToAdmin()" style="padding: 8px 15px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">Buyurtmani yuborish</button>
            </div>
        </div>
    </div>

    <!-- QR / Check Modali -->
    <div id="qr-modal" class="modal-overlay">
        <div class="modal-content" style="width: 350px; text-align: center;">
            <h3>Chek</h3>
            <div id="qr-check-content" style="text-align: left; margin: 15px 0; font-size: 14px;"></div>
            <button onclick="closeQrModal()" style="padding: 8px 20px; background: #2a5298; color: white; border: none; border-radius: 5px; cursor: pointer;">Yopish</button>

            { id: 125, category: "Fast Food", name: "Tako", price: 29000, img: "https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=100" },
            { id: 126, category: "Fast Food", name: "Panini", price: 26000, img: "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=100" },
            { id: 127, category: "Fast Food", name: "Wok lapshasi", price: 35000, img: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=100" },
            { id: 128, category: "Fast Food", name: "Korn-dog", price: 16000, img: "https://images.unsplash.com/photo-1619740455993-9e612b1af08a?w=100" },
            { id: 129, category: "Fast Food", name: "Pishloqli tayoqchalar (Cheese-sticks)", price: 20000, img: "https://images.unsplash.com/photo-1548340748-6d2b7d7da28e?w=100" }
        ];

        let currentActiveSection = 'zal'; // 'zal' yoki 'xonalar'
        let currentActiveTableId = null;
        let activeWaiter = localStorage.getItem('active_waiter') || null;
        let currentCategoryFilter = 'all';

        window.onload = function() {
            if (activeWaiter) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-panel').style.display = 'block';
                document.getElementById('logged-waiter-name').innerText = `Ofitsant: ${activeWaiter}`;
            }
            renderItems();
            startRealTimeClock();
        };

        // Real vaqt soat, sana va maxsus ikonkalari funksiyasi
        function startRealTimeClock() {
            function updateClock() {
                const now = new Date();
                const optionsDate = { year: 'numeric', month: '2-digit', day: '2-digit' };
                const optionsTime = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
                const dateStr = now.toLocaleDateString('uz-UZ', optionsDate);
                const timeStr = now.toLocaleTimeString('uz-UZ', optionsTime);
                
                // So'ralgan maxsus ikonkalarni HTML formatda joylash
                document.getElementById('realtime-clock').innerHTML = `
                    <div style="display: flex; align-items: center; gap: 5px; margin-bottom: 2px;">
                        <img src="https://cdn-icons-png.flaticon.com/256/19029/19029065.png" style="width: 14px; height: 14px; object-fit: contain;" alt="Kalendar">
                        <span>${dateStr}</span>
                    </div>
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <img src="https://thumbs.dreamstime.com/b/food-icons-infographic-clock-flat-design-fitness-diet-calorie-counter-concept-vector-illustration-63065497.jpg" style="width: 14px; height: 14px; object-fit: contain;" alt="Soat">
                        <span>${timeStr}</span>
                    </div>
                `;
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        function loginWaiter() {
            let u = document.getElementById('login-user').value.trim();
            let p = document.getElementById('login-pass').value.trim();
            let found = waitersDB.find(w => w.login === u && w.pass === p);
            if (found) {
                activeWaiter = found.name;
                localStorage.setItem('active_waiter', activeWaiter);
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-panel').style.display = 'block';
                document.getElementById('logged-waiter-name').innerText = `Ofitsant: ${activeWaiter}`;
                renderItems();
            } else {
                alert("Login yoki parol noto'g'ri!");
            }
        }

        function logoutWaiter() {
            localStorage.removeItem('active_waiter');
            activeWaiter = null;
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('main-panel').style.display = 'none';
        }

        function switchSection(section) {
            currentActiveSection = section;
            document.getElementById('folder-zal').classList.remove('active');
            document.getElementById('folder-xonalar').classList.remove('active');

            if (section === 'zal') {
                document.getElementById('folder-zal').classList.add('active');
                document.getElementById('section-heading-title').innerText = 'Zal Stollari (16 ta)';
            } else {
                document.getElementById('folder-xonalar').classList.add('active');
                document.getElementById('section-heading-title').innerText = 'Xonalar (12 ta)';
            }
            renderItems();
        }

        function renderItems() {
            const grid = document.getElementById('tables-grid');
            grid.innerHTML = '';
            
            let count = (currentActiveSection === 'zal') ? 16 : 12;

            for (let i = 1; i <= count; i++) {
                let key = `${currentActiveSection}_item_${i}`;
                let itemData = JSON.parse(localStorage.getItem(key)) || { busy: false, guests: 0, items: [] };
                
                let titlePrefix = (currentActiveSection === 'zal') ? 'Stol #' : 'Xona #';

                // Talabga ko'ra maxsus rasmlar qo'yildi:
                // 1. Stol uchun: https://cdn-icons-png.flaticon.com/512/7067/7067120.png
                // 2. Xona uchun: https://cdn-icons-png.flaticon.com/512/7845/7845744.png
                let iconSrc = (currentActiveSection === 'zal') 
                    ? 'https://cdn-icons-png.flaticon.com/512/7067/7067120.png' 
                    : 'https://cdn-icons-png.flaticon.com/512/7845/7845744.png';

                grid.innerHTML += `
                    <div class="table-card ${itemData.busy ? 'busy' : ''}" onclick="openItemModal('${currentActiveSection}', ${i})">
                        <img src="${iconSrc}" class="table-icon" alt="Ikonka">
                        <h4 style="margin:5px 0;">${titlePrefix}${i}</h4>
                        <p style="font-size: 13px; margin: 0; font-weight: bold;">${itemData.busy ? `🔴 Band (${itemData.guests} kishi)` : '🟢 Bo\'sh'}</p>
                    </div>
                `;
            }
        }

        function openItemModal(section, id) {
            currentActiveTableId = { section, id };
            let titlePrefix = (section === 'zal') ? `Stol #${id}` : `Xona #${id}`;
            document.getElementById('modal-title').innerText = `${titlePrefix} Boshqaruvi`;
            
            let key = `${section}_item_${id}`;
            let itemData = JSON.parse(localStorage.getItem(key)) || { busy: false, guests: 1, items: [] };
            
            document.getElementById('modal-guests-val').innerText = itemData.guests || 1;
            currentCategoryFilter = 'all';
            
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector('.tab-btn').classList.add('active');

            renderMenuSelection(itemData.items);
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function changeGuests(delta) {
            let valSpan = document.getElementById('modal-guests-val');
            let currentGuests = parseInt(valSpan.innerText) + delta;
            if (currentGuests < 1) currentGuests = 1;
            valSpan.innerText = currentGuests;

            let key = `${currentActiveTableId.section}_item_${currentActiveTableId.id}`;
            let itemData = JSON.parse(localStorage.getItem(key)) || { busy: false, guests: 1, items: [] };
            itemData.guests = currentGuests;
            localStorage.setItem(key, JSON.stringify(itemData));
        }

        function filterModalMenu(category, event) {
            currentCategoryFilter = category;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            let key = `${currentActiveTableId.section}_item_${currentActiveTableId.id}`;
            let itemData = JSON.parse(localStorage.getItem(key)) || { items: [] };
            renderMenuSelection(itemData.items);
        }

        function renderMenuSelection(selectedItems) {
            let container = document.getElementById('menu-selection-list');
            container.innerHTML = '';

            let filteredMenu = currentCategoryFilter === 'all' 
                ? fullMenu 
                : fullMenu.filter(item => item.category === currentCategoryFilter);

            filteredMenu.forEach(dish => {
                let existing = selectedItems.find(i => i.id === dish.id);
                let qty = existing ? existing.qty : 0;

                container.innerHTML += `
                    <div class="menu-item-row">
                        <img src="${dish.img}" class="menu-item-img" alt="${dish.name}">
                        <div style="flex-grow: 1; margin-left: 12px;">
                            <strong>${dish.name}</strong><br>
                            <span style="color: #666; font-size: 13px;">${dish.price.toLocaleString()} so'm</span>
                        </div>
                        <div>
                            <button class="qty-btn" onclick="changeQty(${dish.id}, -1)">-</button>
                            <span id="qty_${dish.id}" style="margin: 0 10px; font-weight: bold;">${qty}</span>
                            <button class="qty-btn" onclick="changeQty(${dish.id}, 1)">+</button>
                        </div>
                    </div>
                `;
            });
            updateOrderSummaryUI(selectedItems);
        }

        window.changeQty = function(dishId, delta) {
            let key = `${currentActiveTableId.section}_item_${currentActiveTableId.id}`;
            let itemData = JSON.parse(localStorage.getItem(key)) || { busy: false, guests: parseInt(document.getElementById('modal-guests-val').innerText), items: [] };
            let existing = itemData.items.find(i => i.id === dishId);

            if (existing) {
                existing.qty += delta;
                if (existing.qty <= 0) {
                    itemData.items = itemData.items.filter(i => i.id !== dishId);
                }
            } else if (delta > 0) {
                let dish = fullMenu.find(d => d.id === dishId);
                if (dish) {
                    itemData.items.push({ id: dish.id, name: dish.name, price: dish.price, qty: 1 });
                }
            }

            localStorage.setItem(key, JSON.stringify(itemData));
            renderMenuSelection(itemData.items);
        }

        function updateOrderSummaryUI(items) {
            let summaryContainer = document.getElementById('current-order-summary');
            if (items.length === 0) {
                summaryContainer.innerHTML = '<p style="color: #777; font-style: italic; margin: 0; font-size: 13px;">Hozircha buyurtma bo\'sh</p>';
                return;
            }
            let html = '<ul style="padding-left: 20px; margin: 0 0 8px 0; font-size: 14px;">';
            let total = 0;
            items.forEach(i => {
                html += `<li>${i.name} - ${i.qty} ta x ${i.price.toLocaleString()} so'm = <b>${(i.qty * i.price).toLocaleString()} so'm</b></li>`;
                total += i.qty * i.price;
            });
            html += `</ul><div style="text-align: right; font-size: 15px;">Umumiy summa: <b>${total.toLocaleString()} so'm</b></div>`;
            summaryContainer.innerHTML = html;
        }

        function sendOrderToAdmin() {
            let guests = parseInt(document.getElementById('modal-guests-val').innerText);
            let key = `${currentActiveTableId.section}_item_${currentActiveTableId.id}`;
            let itemData = JSON.parse(localStorage.getItem(key)) || { items: [] };
            
            if(itemData.items.length === 0) {
                alert("Iltimos, avval buyurtmaga taom qo'shing!");
                return;
            }

            itemData.busy = true;
            itemData.guests = guests;
            itemData.waiter = activeWaiter; // Qaysi ofitsant buyurtma bergani saqlanadi
            itemData.status = 'Tayyorlanyapti';

            localStorage.setItem(key, JSON.stringify(itemData));

            let allOrders = JSON.parse(localStorage.getItem('admin_orders')) || [];
            allOrders.push({ 
                type: currentActiveTableId.section, 
                number: currentActiveTableId.id, 
                ...itemData, 
                time: new Date().toLocaleTimeString() 
            });
            localStorage.setItem('admin_orders', JSON.stringify(allOrders));

            alert(`Buyurtma Admin paneliga yuborildi! (Ofitsant: ${activeWaiter})`);
            closeModal();
            renderItems();
        }

        function printCheck() {
            let key = `${currentActiveTableId.section}_item_${currentActiveTableId.id}`;
            let itemData = JSON.parse(localStorage.getItem(key));
            if (!itemData || itemData.items.length === 0) {
                alert("Chek chiqarish uchun buyurtma mavjud emas!");
                return;
            }
            
            let totalAmount = itemData.items.reduce((sum, i) => sum + (i.qty * i.price), 0);
            let locName = (currentActiveTableId.section === 'zal') ? `Stol #${currentActiveTableId.id}` : `Xona #${currentActiveTableId.id}`;

            let history = JSON.parse(localStorage.getItem('service_history')) || [];
            history.push({
                location: locName,
                waiter: activeWaiter,
                time: new Date().toLocaleString(),
                items: itemData.items,
                guests: itemData.guests,
                total: totalAmount
            });
            localStorage.setItem('service_history', JSON.stringify(history));

            let checkHtml = `<b>Joy:</b> ${locName}<br><b>Ofitsant:</b> ${activeWaiter}<br><b>Vaqt:</b> ${new Date().toLocaleString()}<br><hr style="border:0; border-top:1px dashed #aaa">`;
            itemData.items.forEach(i => {
                checkHtml += `${i.name} x ${i.qty} = ${(i.qty * i.price).toLocaleString()} so'm<br>`;
            });
            checkHtml += `<hr style="border:0; border-top:1px dashed #aaa"><b>Jami to'lov: ${totalAmount.toLocaleString()} so'm</b>`;
            
            document.getElementById('qr-check-content').innerHTML = checkHtml;
            document.getElementById('qr-modal').style.display = 'flex';
            
            closeModal();
            renderItems();
        }

        function closeQrModal() {
            document.getElementById('qr-modal').style.display = 'none';
        }

        function openHistory() {
            let history = JSON.parse(localStorage.getItem('service_history')) || [];
            let container = document.getElementById('history-list');
            container.innerHTML = '';
            if (history.length === 0) {
                container.innerHTML = '<p>Hozircha tarix bo\'sh.</p>';
            } else {
                history.slice().reverse().forEach(h => {
                    let sumText = h.total ? ` | To'lov: <b>${h.total.toLocaleString()} so'm</b>` : '';
                    container.innerHTML += `
                        <div style="border-bottom: 1px solid #ccc; padding: 8px 0;">
                            <strong>${h.location}</strong> | Ofitsant: ${h.waiter} | Vaqt: ${h.time} | Mehmonlar: ${h.guests} ta${sumText}
                        </div>
                    `;
                });
            }
            document.getElementById('history-modal').style.display = 'flex';
        }

        function closeHistory() {
            document.getElementById('history-modal').style.display = 'none';
        }
    </script>
