<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Paneli - Ombor va Tannarx Tizimi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-6">
    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-xl shadow gap-4">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-800">⚙️ Admin Boshqaruv Paneli</h1>
            <div class="flex items-center gap-3">
                <span class="text-sm text-slate-500">Ombor & Tannarx Tizimi</span>
                <span class="h-3 w-3 bg-emerald-500 rounded-full animate-pulse"></span>
            </div>
        </header>

        <!-- Jadval qismi -->
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-800 text-white text-xs uppercase tracking-wider">
                            <th class="p-3">Rasm</th>
                            <th class="p-3">Kategoriya / Nomi</th>
                            <th class="p-3">Ichki Narx (Tannarx)</th>
                            <th class="p-3">Tashqi Narx (Ofitsantga)</th>
                            <th class="p-3">Ombor Qoldig'i</th>
                            <th class="p-3">Ofitsantga Ko'rinishi</th>
                            <th class="p-3 text-center">Amallar</th>
                        </tr>
                    </thead>
                    <tbody id="admin-menu-table" class="divide-y divide-slate-200 text-sm">
                        <!-- Ma'lumotlar dinamik tushadi -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        async function fetchAdminMenu() {
            try {
                const res = await fetch('/api/admin/menu');
                const items = await res.json();
                renderTable(items);
            } catch (err) {
                console.error("Xatolik:", err);
            }
        }

        function renderTable(items) {
            const tbody = document.getElementById('admin-menu-table');
            tbody.innerHTML = '';

            items.forEach(item => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition" id="row-${item.id}">
                        <td class="p-3">
                            <img src="/images/${item.image_url}" alt="" class="w-12 h-12 object-cover rounded-lg bg-slate-200" onerror="this.src='/images/default.jpg'">
                        </td>
                        <td class="p-3">
                            <span class="block text-xs font-semibold text-indigo-600">${item.category}</span>
                            <input type="text" id="name-${item.id}" value="${item.name}" class="font-bold text-slate-800 bg-transparent border-b border-transparent focus:border-indigo-500 focus:outline-none w-full">
                        </td>
                        <td class="p-3">
                            <input type="number" id="internal-${item.id}" value="${item.internal_price}" class="w-32 p-1.5 border rounded bg-amber-50/50 font-semibold text-amber-700">
                        </td>
                        <td class="p-3">
                            <input type="number" id="external-${item.id}" value="${item.external_price}" class="w-32 p-1.5 border rounded bg-emerald-50/50 font-semibold text-emerald-700">
                        </td>
                        <td class="p-3">
                            <input type="number" id="stock-${item.id}" value="${item.stock_quantity}" class="w-24 p-1.5 border rounded bg-slate-50 font-medium">
                        </td>
                        <td class="p-3">
                            <select id="visible-${item.id}" class="p-1.5 border rounded bg-white font-medium">
                                <option value="1" ${item.is_visible == 1 ? 'selected' : ''}>Ko'rinadi</option>
                                <option value="0" ${item.is_visible == 0 ? 'selected' : ''}>Yashirin</option>
                            </select>
                        </td>
                        <td class="p-3 text-center">
                            <button onclick="saveItem(${item.id})" class="px-4 py-2 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 shadow-sm transition">
                                Saqlash
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        async function saveItem(id) {
            const name = document.getElementById(`name-${id}`).value;
            const internal_price = document.getElementById(`internal-${id}`).value;
            const external_price = document.getElementById(`external-${id}`).value;
            const stock_quantity = document.getElementById(`stock-${id}`).value;
            const is_visible = document.getElementById(`visible-${id}`).value;

            try {
                const res = await fetch(`/api/admin/menu/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, internal_price, external_price, stock_quantity, is_visible })
                });

                const data = await res.json();
                if (data.success) {
                    alert("Muvaffaqiyatli saqlandi va ofitsant ekraniga sinxronlandi!");
                } else {
                    alert("Xatolik yuz berdi!");
                }
            } catch (err) {
                console.error("Saqlashda xatolik:", err);
            }
        }

        // Socket orqali yangilanishlarni kuzatish
        socket.on('menuUpdated', (items) => {
            renderTable(items);
        });

        fetchAdminMenu();
    </script>
</body>
</html>
